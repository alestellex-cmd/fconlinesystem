<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FC ONLINE CHAMPIONS TOUR</title>
<style>
:root{--bg:#0b1220;--card:#111a2e;--bd:#22304d;--tx:#e6edf7;--mu:#8da0c0;--fire:#f97316;--ok:#10b981}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 14px;background:var(--card);border-bottom:1px solid var(--bd)}
header h1{font-size:16px;margin:0;color:var(--fire);letter-spacing:.5px}
button,select{background:#16223b;color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
button:hover{border-color:var(--fire)}
.sp{flex:1}
nav{display:flex;gap:4px;padding:6px 14px 0;background:var(--card);overflow-x:auto;border-bottom:1px solid var(--bd)}
nav button{border-radius:8px 8px 0 0;border-bottom:none;white-space:nowrap;font-weight:700;font-size:12px;color:var(--mu)}
nav button.on{color:#fff;background:var(--bg);border-color:var(--fire)}
.bd{margin-left:6px;font-size:11px}.bd.ok{color:var(--ok)}.bd.wip{color:var(--fire)}
#stage{flex:1;position:relative;min-height:0}
#stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
.ph{position:absolute;inset:0;padding:40px 20px;overflow:auto}
.ph .c{max-width:620px;margin:0 auto;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:22px}
.ph h2{margin-top:0;color:var(--fire)}.ph li{margin:6px 0;color:var(--mu);font-size:14px}

/* ===== PHÂN QUYỀN: người xem / admin ===== */
body.role-user .admin-only{display:none!important}
body.role-admin .user-only{display:none!important}
.brand{display:flex;flex-direction:column;gap:2px;line-height:1.1}
.brand small{color:var(--mu);font-size:11px;letter-spacing:.4px}
.pill{font-size:11px;font-weight:800;letter-spacing:.8px;padding:3px 9px;border-radius:999px}
.pill.adm{background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid rgba(239,68,68,.5)}
.pill.vw{background:rgba(56,189,248,.12);color:#7dd3fc;border:1px solid rgba(56,189,248,.4)}
.lg-bg{position:fixed;inset:0;background:rgba(3,8,20,.72);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:99}
.lg-bg.on{display:flex}
.lg-box{width:min(380px,92vw);background:linear-gradient(160deg,#16213d,#0f1830);border:1px solid #2d4170;border-radius:16px;padding:24px 24px 20px;box-shadow:0 24px 80px rgba(0,0,0,.7)}
.lg-box h3{margin:0 0 4px;font-size:18px;color:#fff}.lg-box p{margin:0 0 16px;color:var(--mu);font-size:12.5px}
.lg-box label{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px}
.lg-box input{width:100%;background:#0b1326;border:1px solid #2a3b63;border-radius:8px;color:var(--tx);padding:10px 12px;font:inherit;font-size:14px}
.lg-box input:focus{outline:none;border-color:var(--fire);box-shadow:0 0 0 3px rgba(249,115,22,.2)}
.lg-err{color:#fca5a5;font-size:12.5px;min-height:18px;margin-top:10px}
.lg-row{display:flex;gap:8px;margin-top:14px}.lg-row button{flex:1;padding:10px;font-weight:700}
.lg-row .go{background:linear-gradient(90deg,#f97316,#fb923c);border-color:transparent;color:#fff}
/* ----- Giao diện người xem (decor) ----- */
body.role-user{background:radial-gradient(1100px 420px at 85% -8%,rgba(249,115,22,.12),transparent 60%),radial-gradient(900px 420px at -8% 0,rgba(56,189,248,.09),transparent 55%),var(--bg)}
body.role-user header{background:linear-gradient(120deg,#0f1b34 0%,#15213f 55%,#1c2a52 100%);border-bottom:1px solid #2a3b63;position:relative;overflow:hidden;padding:12px 20px;gap:14px}
body.role-user header::before{content:'';position:absolute;right:-60px;top:-90px;width:380px;height:240px;background:radial-gradient(closest-side,rgba(249,115,22,.30),transparent);pointer-events:none}
body.role-user header h1{font-size:19px;letter-spacing:1.6px;background:linear-gradient(90deg,#fff,#fdba74 55%,#f97316);-webkit-background-clip:text;background-clip:text;color:transparent}
body.role-user header>*{position:relative}
body.role-user header select{background:#0f1a33;border-color:#2a3b63;border-radius:999px;padding:5px 12px}
body.role-user nav{background:#0d1630;padding:9px 16px;gap:7px;border-bottom:1px solid #1d2b4a;scrollbar-width:thin}
body.role-user nav button{border-radius:999px;border:1px solid #243557;background:#121d37;padding:7px 15px;letter-spacing:.3px;transition:all .18s}
body.role-user nav button:hover{border-color:#f97316;color:#fff;transform:translateY(-1px)}
body.role-user nav button.on{background:linear-gradient(90deg,#f97316,#fb923c);color:#fff;border-color:transparent;box-shadow:0 4px 16px rgba(249,115,22,.38)}
body.role-user nav .bd.ok{color:#bbf7d0}body.role-user nav .on .bd{color:#fff}
body.role-admin header{border-bottom:2px solid rgba(239,68,68,.55)}
</style></head><body class="role-user">
<header>
  <div class="brand"><h1>FC ONLINE CHAMPIONS TOUR</h1><small id="roleLine">Cổng thông tin giải đấu</small></div>
  <label style="font-size:13px;color:var(--mu)">Năm <select id="yearSel"></select></label>
  <button class="admin-only" onclick="FV.newYear()" title="Tạo năm mới, mang top 4 Summer sang Spring">➕ Sang năm mới</button>
  <span class="sp"></span>
  <span class="pill vw user-only">CHỈ XEM</span>
  <button class="user-only" onclick="Auth.open()" title="Đăng nhập quản trị">🔐 Admin</button>
  <span class="pill adm admin-only">ADMIN</span>
  <button class="admin-only" onclick="FV.exportAll()">⬇ Xuất JSON</button>
  <button class="admin-only" onclick="document.getElementById('impf').click()">⬆ Nhập JSON</button>
  <input type="file" id="impf" accept=".json" style="display:none" onchange="FV.importAll(this.files[0])">
  <button class="admin-only" onclick="Auth.logout()">Đăng xuất</button>
</header>
<div class="lg-bg" id="lgBg" onclick="if(event.target===this)Auth.close()"><div class="lg-box">
  <h3>🔐 Đăng nhập quản trị</h3><p>Chỉ admin mới được chỉnh sửa dữ liệu giải đấu. Người xem không cần đăng nhập.</p>
  <label>Tài khoản</label><input id="lgUser" type="text" autocomplete="username" onkeydown="if(event.key==='Enter')Auth.submit()">
  <label>Mật khẩu</label><input id="lgPass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')Auth.submit()">
  <div class="lg-err" id="lgErr"></div>
  <div class="lg-row"><button onclick="Auth.close()">Huỷ</button><button class="go" onclick="Auth.submit()">Đăng nhập</button></div>
</div></div>
<nav id="tabs"></nav>
<div id="stage"></div>
<!-- ==================== HƯỚNG DẪN CHỈNH SỬA ====================
 File gồm: (1) KHUNG CHUNG (thanh năm, tab, xuất/nhập JSON) và (2) ba khối mã nguồn nằm trong các thẻ script type="text/plain".
 Mỗi khối là NGUYÊN MỘT TRANG HTML đầy đủ (head, style, body, script), sửa trực tiếp như file html bình thường:
   tpl-fvpl     -> dùng cho 2 tab FVPL SPRING và FVPL SUMMER (cùng một mã, khác nhau theo biến window.FV_SEASON)
   tpl-master   -> dùng cho 2 tab FC PRO MASTER và FC PRO CHAMPIONS (khác nhau theo biến window.FV_MODE)
   tpl-allstar  -> dùng cho 2 tab ALL-STAR SPRING (id asvn) và FC PRO ALL-STAR (id asint) (khác nhau theo biến window.FV_AS)
   tpl-assummer -> tab ALL-STAR SUMMER (32 người, vòng bảng GSL, knock-out, playoff)
   tpl-profile  -> tab HỒ SƠ: trang tuyển thủ + đội tuyển (đọc dữ liệu FVSYS của mọi năm, mở bằng openProfile('player'|'team', tên))
 LƯU Ý: bên trong các khối, chuỗi "</scr_ipt" thực chất là thẻ đóng script, và "<!-_-" là mở chú thích HTML.
 Hai chuỗi này được viết lệch một ký tự gạch dưới để trình duyệt không cắt nhầm khối. Hãy giữ nguyên khi sửa,
 nếu cần thêm thẻ đóng script hay chú thích HTML mới thì cũng viết theo cách đó.
 Dữ liệu từng giải lưu trong trình duyệt theo khoá FVSYS:<năm>:<tab>:..., dùng nút Xuất JSON để sao lưu.
=========================================================================== -->
<!-- ==================== MÃ NGUỒN: FVPL SPRING + FVPL SUMMER ==================== -->
<script type="text/plain" id="tpl-fvpl">
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FVPL SPRING 2027</title>
<style>
:root{
  --bg:#090d16;--card:#131c2e;--card-sub:#0a101d;--tx:#f1f5f9;--mu:#94a3b8;--bd:#223147;--ac:#38bdf8;
  --win-bg:#064e3b;--win-tx:#6ee7b7;--win-bd:#047857;
  --lose-bg:#7f1d1d;--lose-tx:#fca5a5;--lose-bd:#991b1b;
  --gold:#f59e0b;--gold-bg:rgba(245,158,11,0.15);--gold-bd:#d97706;
  --fire:#ea580c;
  box-sizing:border-box;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,sans-serif;padding:12px;max-width:1440px;margin:auto}

/* HEADER & NAVIGATION */
.app-header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--card);border:1px solid var(--bd);border-radius:10px;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.app-brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;color:#f97316;letter-spacing:-0.5px}
.nav-tabs{display:flex;gap:6px}
.nav-tab{padding:8px 16px;border-radius:8px;border:1px solid var(--bd);background:var(--card-sub);color:var(--mu);cursor:pointer;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.nav-tab:hover{color:var(--tx);border-color:var(--ac)}
.nav-tab.active{background:var(--fire);color:#fff;border-color:var(--fire);box-shadow:0 2px 8px rgba(234,88,12,0.4)}

.tab-pane{display:none}
.tab-pane.active{display:block}

h2{font-size:15px;margin:20px 0 10px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;border-left:4px solid var(--fire);padding-left:10px;color:var(--tx);font-weight:700}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--mu);font-weight:600;padding:8px 6px;border-bottom:1px solid var(--bd);text-align:center}
td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--bd)}
td:first-child,th:first-child{text-align:left}
tr.q td{background:var(--win-bg);font-weight:600}
tr.elim td{opacity:0.65;background:var(--lose-bg)}

.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--bd);font-weight:600}
.tag-win{background:var(--win-bg);color:var(--win-tx);border:1px solid var(--win-bd)}
.tag-lose{background:var(--lose-bg);color:var(--lose-tx);border:1px solid var(--lose-bd)}

/* Chỉ bôi vàng ô nhập tên đội trưởng (thành viên đầu tiên) ở Roster */
.player-item-input.is-captain input[data-tp] {
  border-color: var(--gold) !important;
  color: var(--gold) !important;
  font-weight: 700;
  background: rgba(245, 158, 11, 0.08);
}

/* Ẩn mũi tên cho TẤT CẢ các ô số để giao diện đồng bộ */
input[type="number"]::-webkit-outer-spin-button,
input[type="number"]::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}
input[type="number"] {
  -moz-appearance: textfield;
  appearance: textfield;
}
/* CSS Kéo thả xếp cặp đấu & Nút reset trận lẻ */
.drag-slot {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 6px;
  border-radius: 4px;
  transition: all 0.15s ease;
}
.drag-slot.can-drag {
  cursor: grab;
  border: 1px dashed rgba(56, 189, 248, 0.4);
  background: rgba(56, 189, 248, 0.05);
}
.drag-slot.can-drag:active {
  cursor: grabbing;
  opacity: 0.6;
}
.drag-slot.drag-over {
  border: 1px solid var(--gold) !important;
  background: rgba(245, 158, 11, 0.25) !important;
  transform: scale(1.03);
}
.m-reset-btn {
  background: transparent;
  border: 1px solid var(--bd);
  color: var(--mu);
  font-size: 11px;
  padding: 1px 5px;
  border-radius: 4px;
  cursor: pointer;
  line-height: 1;
  transition: 0.15s;
}
.m-reset-btn:hover {
  border-color: #ef4444;
  color: #ef4444;
  background: rgba(239, 68, 68, 0.1);
}

/* Tinh chỉnh riêng cho ô Power Shot có mũi tên tăng giảm */
input.ps-input {
  width: 60px;
  padding-right: 2px;
}
input.ps-input::-webkit-inner-spin-button {
  opacity: 1; /* Luôn hiển thị mũi tên rõ ràng */
  cursor: pointer;
}
input,select{font:inherit;color:var(--tx);background:var(--card-sub);border:1px solid var(--bd);border-radius:6px;padding:5px 8px}
input.n{width:100%;min-width:80px}
input.s{width:54px;height:32px;text-align:center;font-weight:900;font-size:17px}
input.s-small{width:32px;height:24px;text-align:center;font-weight:600;font-size:11px;padding:1px}
input.ps-input{width:56px;text-align:center;font-weight:700;background:rgba(234,88,12,0.1);border-color:var(--gold)}
/* Nút mũi tên tăng/giảm cho ô số */
.stp{display:flex;align-items:stretch;gap:2px}
.stp input{flex:1;min-width:0;width:auto!important}
.stp input.ps-input{width:44px!important;flex:none}
.stp-b{display:flex;flex-direction:column;gap:2px;width:20px}
.stp-b button{flex:1;min-height:0;padding:0;font-size:9px;line-height:1;justify-content:center;border-radius:4px;color:var(--mu)}
.stp-b button:hover{color:var(--tx);border-color:var(--gold)}
.stp.inl{display:inline-flex}
table.st th.lf, table.st td.lf{text-align:left!important;padding-left:24px}
#teamStatsCard .st th:nth-child(2), #teamStatsCard .st td:nth-child(2){text-align:center}
.ovr-cell{display:flex;align-items:baseline;gap:10px;width:155px}
.ovr-main{flex:0 0 64px;text-align:right;font-size:14px;color:var(--ac);font-variant-numeric:tabular-nums}
.ovr-d{flex:1;text-align:left;font-variant-numeric:tabular-nums}


select.p-sel{max-width:145px;width:100%;font-size:12px;padding:3px 6px;border-radius:5px;background:var(--card-sub);font-weight:500;text-overflow:ellipsis}
select.p-sel option:disabled{color:#64748b;opacity:0.35;background:#090d16}

button{font:inherit;border:1px solid var(--bd);background:var(--card-sub);color:var(--tx);border-radius:6px;padding:6px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.15s}
button:hover{border-color:var(--ac);color:var(--ac)}
button.primary{background:var(--ac);color:#090d16;border-color:var(--ac);font-weight:700}
button.primary:hover{opacity:.9}
button.fb{padding:3px 8px;font-size:12px}

/* ROSTER GRID */
.roster{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:14px}
.rp{display:flex;flex-direction:column;gap:6px;padding:10px 12px;background:rgba(255,255,255,.02);border-radius:8px;border:1px solid var(--bd)}
.team-seed{font-weight:800;font-size:11px;color:var(--fire);text-transform:uppercase;letter-spacing:0.5px}
.team-head-inputs{display:grid;grid-template-columns:1fr 80px;gap:6px}
.player-list-inputs{display:grid;grid-template-columns:1fr;gap:6px}
.player-item-input{display:flex;gap:4px;align-items:center}
.player-item-input input.p-ovr{width:38px;text-align:center;font-weight:700;color:var(--ac);padding:4px 0}
.lg{height:1.35em;width:1.35em;object-fit:contain;vertical-align:middle;margin-right:4px;border-radius:3px}

/* TEAM TILES 4x4 */
.team-grid-4x4{display:grid;grid-template-columns:repeat(8,1fr);gap:10px;margin-bottom:14px}
.team-tile{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 8px;background:var(--card-sub);border:1px solid var(--bd);border-radius:8px;cursor:pointer;transition:.2s;gap:6px;text-align:center}
.team-tile:hover{border-color:var(--fire);background:rgba(234,88,12,.08);transform:translateY(-2px)}
.team-tile-logo{width:44px;height:44px;object-fit:contain;border-radius:6px;background:rgba(255,255,255,.04);padding:2px}
.team-tile-tag{font-weight:800;font-size:14px;letter-spacing:0.5px}
.team-tile-ovr{font-size:11px;color:var(--ac);font-weight:700}

/* MODAL */
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.75);z-index:9999;align-items:center;justify-content:center;padding:16px}
.modal-box{background:var(--card);border:1px solid var(--bd);border-radius:10px;width:100%;max-width:540px;padding:18px;box-shadow:0 12px 30px rgba(0,0,0,.8);position:relative}
.modal-header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bd);padding-bottom:10px;margin-bottom:12px}
.modal-close{cursor:pointer;font-weight:700;font-size:18px;background:transparent;border:none;color:var(--mu);padding:2px 8px}
.modal-close:hover{color:#fff}
.modal-player-row{display:flex;align-items:center;justify-content:space-between;padding:8px 6px;border-bottom:1px solid rgba(255,255,255,.05);font-size:13px}
.modal-player-row:last-child{border-bottom:none}
.ovr-pill{display:inline-flex;align-items:center;gap:4px;font-weight:800;padding:2px 8px;border-radius:4px;font-size:12px}
.ovr-up{color:#10b981}
.ovr-down{color:#ef4444}

/* WHEEL OF NAMES */
.wheel-section{display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:center;padding:6px 0}
.wheel-box{position:relative;width:320px;height:320px;display:flex;align-items:center;justify-content:center;cursor:pointer}
#wheelCanvas{border-radius:50%;box-shadow:0 6px 20px rgba(0,0,0,.6);background:#0a101d}
.wheel-pointer{position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:22px solid #ef4444;z-index:10;pointer-events:none}
.wheel-controls{display:flex;flex-direction:column;gap:8px;min-width:280px;max-width:380px;flex:1}

/* POPUP THÔNG BÁO ĐỘI VỪA QUAY (1/3 MÀN HÌNH, TỰ TẮT SAU 1 GIÂY) */
.spin-popup-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(9, 13, 22, 0.7);
  backdrop-filter: blur(4px);
  z-index: 99999;
  align-items: center;
  justify-content: center;
}
.spin-popup-box {
  width: 33.333vw; /* Đúng tỉ lệ 1/3 màn hình */
  min-width: 320px;
  max-width: 480px;
  background: linear-gradient(145deg, #131c2e, #0a101d);
  border: 2px solid var(--gold);
  border-radius: 14px;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 25px rgba(245, 158, 11, 0.25);
  padding: 24px 18px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 12px;
  animation: spinPopupIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.25);
}
@keyframes spinPopupIn {
  from { opacity: 0; transform: scale(0.75); }
  to { opacity: 1; transform: scale(1); }
}
.spin-popup-logo {
  width: 80px;
  height: 80px;
  object-fit: contain;
  filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.5));
}
.spin-popup-name {
  font-size: 20px;
  font-weight: 800;
  color: #fff;
  letter-spacing: -0.3px;
}
.spin-popup-tag {
  font-size: 13px;
  font-weight: 700;
  color: var(--gold);
  background: rgba(245, 158, 11, 0.12);
  border: 1px solid var(--gold-bd);
  padding: 2px 10px;
  border-radius: 99px;
}
/* SWISS SECTION */
.swiss-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.swiss-tabs button.active{background:var(--fire);color:#fff;border-color:var(--fire)}
.swiss-matches{display:flex;flex-direction:column;gap:12px}
.swiss-sub-group{background:rgba(255,255,255,.015);border:1px solid var(--bd);border-radius:8px;padding:10px}
.swiss-sub-title{font-size:12px;font-weight:700;color:var(--mu);margin:0 0 8px 0;display:flex;align-items:center;justify-content:space-between}
.swiss-sub-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.swiss-sub-grid.single-col{grid-template-columns:1fr}
@media(max-width:760px){.swiss-sub-grid{grid-template-columns:1fr}}

/* MATCH BOX */
.m{background:var(--card);border:1px solid var(--bd);border-radius:8px;overflow:hidden;position:relative}
.m.done{border-left:4px solid var(--win-tx)}
.mh{display:flex;align-items:center;gap:6px;padding:7px 10px;cursor:pointer;user-select:none;background:rgba(255,255,255,.01)}
.mh.off{cursor:default;opacity:.7}
.mh .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.mh .nm:first-child{text-align:right}
.nm.w{font-weight:700;color:var(--win-tx)}
.nm.l{color:var(--mu)}
.sc{min-width:54px;text-align:center;background:var(--bd);border-radius:5px;padding:3px 6px;font-weight:800;font-size:13px}

.gr{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:5px 8px;border-top:1px dashed var(--bd);font-size:12px;background:rgba(0,0,0,.15)}
.gr-col{display:flex;align-items:center;gap:4px;flex:1;min-width:0}
.gr-col.r{justify-content:flex-end}
.gr-mid{display:flex;align-items:center;gap:4px;min-width:96px;justify-content:center}

.gr.pen{background:rgba(0,0,0,.25);padding:2px 8px}
.pk-txt{font-weight:800;font-size:11px;color:var(--mu);letter-spacing:1px}

/* KNOCKOUT BRACKET */
.wrap{overflow-x:auto;padding-bottom:12px}
.bk{position:relative;margin-top:22px}
.bk svg{position:absolute;left:0;top:0;pointer-events:none;fill:none}
.bk path{stroke:var(--mu);stroke-width:1.5;opacity:.4}
.lb{position:absolute;left:0;font-size:11px;font-weight:700;color:var(--mu);letter-spacing:1px}
.mc{position:absolute;width:240px}
.mc .bd{display:flex;height:58px;background:var(--card);border:1px solid var(--bd);border-radius:8px;overflow:hidden;cursor:pointer}
.mc .bd.off{cursor:default;opacity:.8}
.bg{width:52px;background:var(--bd);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:11px;line-height:1.15;text-align:center}
.bg small{font-size:9px;color:var(--mu);font-weight:400}
.rs{flex:1;display:flex;flex-direction:column;min-width:0}
.pr{flex:1;display:flex;align-items:center;gap:6px;padding:0 8px;font-size:12px}
.pr+.pr{border-top:1px solid var(--bd)}
.pr em{font-style:normal;font-size:10px;color:var(--mu);width:34px}
.pr span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr b{min-width:16px;text-align:center}
.pr.w{background:var(--win-bg);color:var(--win-tx);font-weight:700}
.pr.l{color:var(--mu)}
.ex{position:absolute;top:62px;left:0;width:380px;z-index:30;background:var(--card);border:1px solid var(--bd);border-radius:8px;box-shadow:0 10px 25px rgba(0,0,0,.6);padding:6px}

/* STANDINGS TABLE & PRIZES */
.st{min-width:920px}
.st th,.st td{text-align:center;padding:7px 5px}
.st th:first-child,.st td:first-child{text-align:left}
.st th:nth-child(2),.st td:nth-child(2){text-align:left}
.st .rt{text-align:right}

tr.gold-top td{background:var(--gold-bg);font-weight:600}
tr.gold-top td:first-child{box-shadow:inset 4px 0 0 var(--gold)}

.badge-rk{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--bd);align-items:center;justify-content:center;font-weight:700;font-size:11px;margin-right:6px}
.badge-rk.top{background:var(--gold);color:#090d16}
.sh{cursor:pointer;user-select:none;white-space:nowrap}
.ar{color:var(--mu);font-size:10px}

/* ĐIỀU LỆ */
.rule-card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:14px}
.rule-card h3{color:var(--fire);margin-top:0;font-size:15px;display:flex;align-items:center;gap:6px}
.rule-list{margin:0;padding-left:20px;line-height:1.7}
.rule-list li{margin-bottom:6px}
#seasonSelect,button[onclick="addNewSeason()"]{display:none!important}
.summer-only{display:none}
body.is-summer .summer-only{display:block}
body.is-summer .spring-only{display:none}
</style>

<div id="tabRules" class="tab-pane">

  <div class="rule-card">
    <h3>📋 1. Danh sách 16 Suất Hạt Giống</h3>
    <ul class="rule-list">
      <li><b>1.</b> FVPL Summer 2026 1st</li>
      <li><b>2.</b> FVPL Summer 2026 2nd</li>
      <li><b>3.</b> FVPL Summer 2026 3rd</li>
      <li><b>4.</b> FVPL Summer 2026 4th</li>
      <li><b>5.</b> Group A 1st · <b>6.</b> Group B 1st · <b>7.</b> Group C 1st · <b>8.</b> Group D 1st · <b>9.</b> Group E 1st</li>
      <li><b>10.</b> Group A 2nd · <b>11.</b> Group B 2nd · <b>12.</b> Group C 2nd · <b>13.</b> Group D 2nd · <b>14.</b> Group E 2nd</li>
      <li><b>15.</b> Last chance 1st · <b>16.</b> Last chance 2nd</li>
    </ul>
  </div>

  <div class="rule-card">
    <h3>⚽ 2. Thể thức Vòng Swiss &amp; Bốc thăm</h3>
    <ul class="rule-list">
      <li><b>Vòng 1 (Nhánh 0-0):</b> Mặc định ghép cặp hạt giống đối đầu cố định:
        <ul>
          <li>Trận 1: <b>1 vs 16</b> (FVPL Summer 2026 1st vs Last chance 2nd)</li>
          <li>Trận 2: <b>2 vs 15</b> (FVPL Summer 2026 2nd vs Last chance 1st)</li>
          <li>Trận 3: <b>3 vs 14</b> &nbsp;|&nbsp; Trận 4: <b>4 vs 13</b></li>
          <li>Trận 5: <b>5 vs 12</b> &nbsp;|&nbsp; Trận 6: <b>6 vs 11</b></li>
          <li>Trận 7: <b>7 vs 10</b> &nbsp;|&nbsp; Trận 8: <b>8 vs 9</b></li>
        </ul>
      </li>
      <li><b>Vòng 2 trở đi:</b> Chỉ bốc thăm bằng Vòng quay Wheel of Names hoặc ghép cặp tự động khi kết thúc hoàn toàn Vòng 1 (nhánh 0-0). Luôn đảm bảo nguyên tắc <i>No-rematch</i> (không tái đấu).</li>
      <li>Đội đủ <b>3 trận thắng</b> lọt vào Top 8 Playoffs; đội nhận <b>3 trận thua</b> chính thức bị loại (Hạng 9 - 16).</li>
    </ul>
  </div>

  <div class="rule-card">
    <h3>🎮 3. Quy tắc tính Chỉ Số Cầu Thủ (OVR Handicap System)</h3>
    <ul class="rule-list">
      <li><b>Nguyên tắc:</b> Chiến thắng là yếu tố quyết định, các thông số chi tiết chỉ là điểm phụ. Điểm mỗi ván = điểm kết quả + điểm thông số, làm tròn tối đa 3 chữ số thập phân.</li>
      <li><b>Điểm cơ sở của người thắng:</b> 2 + 0,8 × ln(số bàn cách biệt). Thắng càng đậm điểm càng cao nhưng mỗi bàn thêm cộng ít dần (1 bàn = 2,000 · 2 bàn = 2,555 · 3 bàn = 2,879 · 5 bàn = 3,288 · 7 bàn = 3,557). Thắng luân lưu (PK): cơ sở = 1,000.</li>
      <li><b>Hệ số Kèo Trên / Kèo Dưới:</b> d = OVR đối thủ − OVR người thắng, khóa trong khoảng −6 đến +6 (vượt khoảng tính như mức biên).
        <ul>
          <li><b>d ≥ 0 (thắng đối thủ mạnh hơn):</b> nhân (1 + d ÷ 6), tối đa ×2,000 ở d = +6.</li>
          <li><b>d &lt; 0 (thắng đối thủ yếu hơn):</b> nhân (1 + d ÷ 12), tối thiểu ×0,500 ở d = −6.</li>
        </ul>
      </li>
      <li><b>Người thua:</b> bị trừ bằng <b>0,75 × điểm của người thắng</b> trong cùng ván (thắng +1 thì thua −0,75).</li>
      <li><b>Điểm thông số (phụ, tính riêng từng người, tổng giới hạn −0,5 đến +0,5 mỗi ván):</b>
        <ul>
          <li>Sút chính xác: +0,03 mỗi cú · Tắc bóng: +0,04 mỗi lần · Phạm lỗi: −0,03 mỗi lần.</li>
          <li>Chuyền thành công: (% − 80) × 0,01 · Cầm bóng: (% − 50) × 0,01. Hai ô % được khóa trong khoảng 0–100.</li>
          <li>Thẻ vàng: −0,20 mỗi thẻ · Thẻ đỏ: −0,50 mỗi thẻ.</li>
        </ul>
      </li>

var OPEN = {};
/* ==================== TỰ ĐỘNG XÁC ĐỊNH NHÁNH ĐẤU ĐANG DIỄN RA ==================== */
var userSelectedRoundTab = false; // Đánh dấu nếu người dùng bấm tab thủ công

function getDefaultActiveRound(){
  var roundOrder = ['R1', 'R2', 'R3', 'R4', 'R5'];
  var roundCounts = { R1: 8, R2: 8, R3: 8, R4: 6, R5: 3 };
  var lastCompleted = 'R1';

  for(var i = 0; i < roundOrder.length; i++){
    var rk = roundOrder[i];
    var pairs = S.swissPairs[rk] || [];
    
    // Kiểm tra xem vòng này đã bốc thăm trận nào chưa
    var hasPairs = false;
    for(var p = 0; p < pairs.length; p++){
      if(pairs[p] && (pairs[p][0] !== null || pairs[p][1] !== null)){
        hasPairs = true;
        break;
      }
    }

    // Chưa bốc thăm -> Hiển thị nhánh vừa đá xong
    if(!hasPairs){
      return lastCompleted;
    }

    // Kiểm tra vòng này đã hoàn thành hết các trận chưa
    var need = roundCounts[rk];
    var doneCount = 0;
    for(var m = 0; m < need; m++){
      if(series('sw_' + rk + '_' + m, 3).done) doneCount++;
    }

    // Đã bốc nhưng chưa đá xong -> Đây là nhánh đang diễn ra
    if(doneCount < need){
      return rk;
    }

    // Vòng này đã đá xong hết, lưu lại để xét vòng kế tiếp
    lastCompleted = rk;
  }

  // Đã xong cả 5 vòng Swiss -> Hiển thị nhánh 2-2 (R5)
  return 'R5';
}

var currentRoundTab = getDefaultActiveRound();
var SORT_TEAM = {k:null, d:1};
var SORT_PLAYER = {k:null, d:1};

function num(v){ return (v===undefined || v===null || v==='' || isNaN(v)) ? null : +v; }
function esc(s){ return String(s||'').replace(/[&<>"']/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function tLogo(i){ return (i!==null && i!==undefined && S.teams[i]) ? S.teams[i].logo : ''; }

// Xử lý tỉ số BO5 (chạm 3) hoặc BO7 (chạm 4)
function series(key, needWins){
  var maxGames = 2 * needWins - 1;
  var G = S.m[key] || [], w = [0, 0], games = [];
  for(var i = 0; i < maxGames; i++){
    if(w[0] === needWins || w[1] === needWins) break;
    var g = G[i] || [];
    var a = num(g[0]), b = num(g[1]);
    var p0 = (g[4] !== undefined && g[4] !== '') ? +g[4] : null;
    var p1 = (g[5] !== undefined && g[5] !== '') ? +g[5] : null;

    if(a === null || b === null) break;
    var win;
    if(a > b) win = 0;
    else if(b > a) win = 1;
    else {
      var pa = num(g[2]), pb = num(g[3]);
      if(pa !== null && pb !== null && pa !== pb) win = (pa > pb ? 0 : 1);
      else break;
    }
    w[win]++;
    games.push({
      gameIdx: i,
      a: a, b: b,
      win: win,
      pa: num(g[2]), pb: num(g[3]),
      p0: p0, p1: p1,
      s0: g[6] || null,
      s1: g[7] || null
    });
  }
  var done = (w[0] === needWins || w[1] === needWins);
  return {
    w: w,
    done: done,
    winner: done ? (w[0] === needWins ? 0 : 1) : null,
    games: games,
    rows: Math.min(maxGames, games.length + (done ? 0 : 1))
  };
}
// Luật đội hình từ 2028: BO5 trở lên
// - 4 ván đầu: mỗi ván một người khác nhau (đủ cả 4 thành viên)
// - BO7: ván 5 và 6 là 2 người khác nhau; ván 7 tự do. BO5: ván 5 tự do
var NEW_LINEUP = (window.FV_YEAR || 2027) >= 2028;
function lineupNewRule(G, sideCol, pIdx, gameIdx, needWins){
  function val(i){ var v = G[i] && G[i][sideCol]; return (v === undefined || v === null || v === '') ? null : +v; }
  if(gameIdx < 4){
    for(var k = 0; k < 4; k++) if(k !== gameIdx && val(k) === pIdx) return false;
    return true;
  }
  if(needWins >= 4 && (gameIdx === 4 || gameIdx === 5)){
    return val(gameIdx === 4 ? 5 : 4) !== pIdx;
  }
  return true;
}

// Kiểm tra quy định chọn thành viên BO5/BO7
function isPlayerAllowed(key, teamSide, pIdx, gameIdx, needWins){
  var G = S.m[key] || [];
  var sideCol = (teamSide === 0) ? 4 : 5;
  var maxPerMatch = (needWins >= 4) ? 3 : 2;
  if(NEW_LINEUP && needWins >= 3) return lineupNewRule(G, sideCol, pIdx, gameIdx, needWins);

  var curVal = G[gameIdx] && G[gameIdx][sideCol];
  if(curVal !== undefined && curVal !== null && curVal !== '' && +curVal === pIdx){
    return true;
  }

  var countOtherGames = 0;
  for(var i = 0; i < G.length; i++){
    if(i === gameIdx) continue;
    var v = G[i] && G[i][sideCol];
    if(v !== undefined && v !== null && v !== '' && +v === pIdx){
      countOtherGames++;
    }
  }

  if(countOtherGames >= maxPerMatch) return false;

  if(gameIdx < 3){
    for(var k = 0; k < 3; k++){
      if(k === gameIdx) continue;
      var otherVal = G[k] && G[k][sideCol];
      if(otherVal !== undefined && otherVal !== null && otherVal !== '' && +otherVal === pIdx){
        return false;
      }
    }
  }

  return true;
}

function havePlayed(t1, t2){
  if(t1 === t2 || t1 === null || t2 === null) return false;
  var rounds = ['R1','R2','R3','R4','R5'];
  for(var r = 0; r < rounds.length; r++){
    var pairs = S.swissPairs[rounds[r]] || [];
    for(var i = 0; i < pairs.length; i++){
      if(!pairs[i]) continue; // Bỏ qua nếu ô trận này chưa được bốc thăm
      var a = pairs[i][0], b = pairs[i][1];
      if((a === t1 && b === t2) || (a === t2 && b === t1)) return true;
    }
  }
  return false;
}

function getSwissStats(){
  var stats = [];
  for(var i = 0; i < 16; i++){
    stats.push({
      id: i,
      name: S.teams[i].name,
      tag: S.teams[i].tag,
      logo: S.teams[i].logo,
      mw: 0, ml: 0,
      gw: 0, gl: 0,
      gf: 0, ga: 0,
      status: 'active'
    });
  }

  var rounds = ['R1','R2','R3','R4','R5'];
  rounds.forEach(function(rk){
    var pairs = S.swissPairs[rk] || [];
    pairs.forEach(function(pair, idx){
      if(!pair) return; // Bỏ qua ô trống
      var t0 = pair[0], t1 = pair[1];
      if(t0 === null || t1 === null || t0 === undefined || t1 === undefined) return;
      var key = 'sw_' + rk + '_' + idx;
      var s = series(key, 3);

      s.games.forEach(function(g){
        stats[t0].gf += g.a; stats[t0].ga += g.b;
        stats[t1].gf += g.b; stats[t1].ga += g.a;
        if(g.win === 0){ stats[t0].gw++; stats[t1].gl++; }
        else { stats[t1].gw++; stats[t0].gl++; }
      });

      if(s.done){
        var win = (s.winner === 0 ? t0 : t1);
        var los = (s.winner === 0 ? t1 : t0);
        stats[win].mw++;
        stats[los].ml++;
      }
    });
  });

  stats.forEach(function(t){
    t.gd = t.gf - t.ga;
    t.gdiff = t.gw - t.gl;
    t.mdiff = t.mw - t.ml;
    if(t.mw >= 3) t.status = 'qualified';
    else if(t.ml >= 3) t.status = 'eliminated';
  });

  return stats;
}

function getRankedStandings(){
  var st = getSwissStats();

  st.sort(function(a, b){
    // 1. Nhánh đấu: so sánh hiệu số trận thắng/thua (mw - ml), rồi đến số trận thắng (mw)
    var diffA = a.mw - a.ml, diffB = b.mw - b.ml;
    if(diffA !== diffB) return diffB - diffA;
    if(a.mw !== b.mw) return b.mw - a.mw;

    // 2. Hiệu số game (game thắng - game thua)
    if(a.gdiff !== b.gdiff) return b.gdiff - a.gdiff;

    // 3. Số game thắng
    if(a.gw !== b.gw) return b.gw - a.gw;

    // 4. Hiệu số bàn thắng (bàn thắng - bàn thua)
    if(a.gd !== b.gd) return b.gd - a.gd;

    // 5. Số bàn thắng ghi được
    if(a.gf !== b.gf) return b.gf - a.gf;

    return a.id - b.id;
  });

  return st;
}

// Kiểm tra vòng 1 đã hoàn thành hết 8 trận chưa
function isR1Completed(){
  var pairs = S.swissPairs.R1 || [];
  if(pairs.length < 8) return false;
  for(var i = 0; i < 8; i++){
    if(!series('sw_R1_' + i, 3).done) return false;
  }
  return true;
}

function getGroupsToDraw(rk){
  var stats = [];
  for(var i = 0; i < 16; i++){
    stats.push({ id: i, mw: 0, ml: 0 });
  }

  var roundOrder = ['R1','R2','R3','R4','R5'];
  var currentIdx = roundOrder.indexOf(rk);

  for(var r = 0; r < currentIdx; r++){
    var prevRk = roundOrder[r];
    var pairs = S.swissPairs[prevRk] || [];
    pairs.forEach(function(pair, idx){
      if(!pair) return; // Bỏ qua ô trống
      var t0 = pair[0], t1 = pair[1];
      if(t0 === null || t1 === null || t0 === undefined || t1 === undefined) return;
      var s = series('sw_' + prevRk + '_' + idx, 3);
      if(s.done){
        if(s.winner === 0){ stats[t0].mw++; stats[t1].ml++; }
        else { stats[t1].mw++; stats[t0].ml++; }
      }
    });
  }

  var groups = {};
  if(rk === 'R1'){
    return {};
  } else if(rk === 'R2'){
    groups['1-0'] = []; groups['0-1'] = [];
    stats.forEach(function(p){
      if(p.mw === 1 && p.ml === 0) groups['1-0'].push(p.id);
      if(p.mw === 0 && p.ml === 1) groups['0-1'].push(p.id);
    });
  } else if(rk === 'R3'){
    groups['2-0'] = []; groups['1-1'] = []; groups['0-2'] = [];
    stats.forEach(function(p){
      if(p.mw === 2 && p.ml === 0) groups['2-0'].push(p.id);
      if(p.mw === 1 && p.ml === 1) groups['1-1'].push(p.id);
      if(p.mw === 0 && p.ml === 2) groups['0-2'].push(p.id);
    });
  } else if(rk === 'R4'){
    groups['2-1'] = []; groups['1-2'] = [];
    stats.forEach(function(p){
      if(p.mw === 2 && p.ml === 1) groups['2-1'].push(p.id);
      if(p.mw === 1 && p.ml === 2) groups['1-2'].push(p.id);
    });
  } else if(rk === 'R5'){
    groups['2-2'] = [];
    stats.forEach(function(p){
      if(p.mw === 2 && p.ml === 2) groups['2-2'].push(p.id);
    });
  }
  return groups;
}

function findSwissPairings(teams){
  if(teams.length === 0) return [];
  if(teams.length % 2 !== 0) return null;

  var pool = teams.slice();
  for(var i = pool.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var temp = pool[i]; pool[i] = pool[j]; pool[j] = temp;
  }

  function solve(rem){
    if(rem.length === 0) return [];
    var first = rem[0];
    for(var k = 1; k < rem.length; k++){
      var candidate = rem[k];
      if(!havePlayed(first, candidate)){
        var rest = rem.slice(1, k).concat(rem.slice(k + 1));
        var subRes = solve(rest);
        if(subRes !== null){
          return [[first, candidate]].concat(subRes);
        }
      }
    }
    return null;
  }

  return solve(pool);
}

function autoPairCurrentGroup(){
  if(!isR1Completed()){
    alert('Vòng 1 (nhánh 0-0) chưa thi đấu xong! Chỉ được bốc thăm từ Vòng 2 sau khi có kết quả hoàn toàn vòng 1.');
    return;
  }
  var sel = document.getElementById('wheelBracketSelect');
  if(!sel || !sel.value) return;
  var parts = sel.value.split('|');
  var rk = parts[0], grpKey = parts[1];

  var allGroups = getGroupsToDraw(rk);
  var teams = allGroups[grpKey] || [];

  var existingPairs = S.swissPairs[rk] || [];
  var paired = [];
  existingPairs.forEach(function(p){ 
    if(p && p[0] !== null && p[1] !== null) paired.push(p[0], p[1]); 
  });

  var unassigned = teams.filter(function(id){ return paired.indexOf(id) < 0; });
  if(unassigned.length < 2) return;

  var result = findSwissPairings(unassigned);
  if(!result) return;

  var range = getSubGroupSlotRange(rk, grpKey);
  var pPointer = 0;
  for(var idx = range.start; idx < range.end && pPointer < result.length; idx++){
    if(!S.swissPairs[rk][idx] || S.swissPairs[rk][idx][0] === null){
      S.swissPairs[rk][idx] = result[pPointer++];
    }
  }

  save();
  render();
  initWheelCandidates();
}

function clearRoundPairs(rk){
  if(rk === 'R1'){
    for(var idx=0; idx<8; idx++) delete S.m['sw_R1_' + idx];
    S.swissPairs.R1 = DEFAULT_R1_PAIRS.slice();
  } else {
    (S.swissPairs[rk] || []).forEach(function(_, idx){
      delete S.m['sw_' + rk + '_' + idx];
    });
    S.swissPairs[rk] = [];
  }
  save();
  render();
  initWheelCandidates();
}

/* ==================== HÀM HỖ TRỢ TÍNH ĐIỂM OVR (CÔNG THỨC LIÊN TỤC) ==================== */
function r3(x){ return Math.round(x * 1000) / 1000; }
function pct(v){ v = num(v); return v === null ? null : Math.max(0, Math.min(100, v)); }
function fmtOvr(x, signed){
  var n = r3(x);
  if(signed && n === 0) return '0.000'; // Hoặc return '0' nếu bạn muốn số 0 đứng gọn
  var s = n.toFixed(3);
  if(signed && n > 0) s = '+' + s;
  return s;
}
// Hệ số Kèo Trên/Dưới: d = OVR đối thủ - OVR người thắng, khóa trong [-6, +6]
function ovrMult(d){ d = Math.max(-6, Math.min(6, d)); return d >= 0 ? 1 + d / 6 : 1 + d / 12; }
// Điểm thông số (phụ): tổng giới hạn -0.5 ... +0.5 mỗi ván
function statBonusOf(s){
  if(!s) return 0;
  var b = 0, v;
  v = num(s.st);   if(v !== null) b += 0.03 * v;
  v = pct(s.pass); if(v !== null) b += (v - 80) * 0.01;
  v = pct(s.poss); if(v !== null) b += (v - 50) * 0.01;
  v = num(s.tac);  if(v !== null) b += 0.04 * v;
  v = num(s.fl);   if(v !== null) b -= 0.03 * v;
  v = num(s.yc);   if(v !== null) b -= 0.20 * v;
  v = num(s.rc);   if(v !== null) b -= 0.50 * v;
  return Math.max(-0.5, Math.min(0.5, b));
}

/* ==================== TÍNH TOÁN CHỈ SỐ CẦU THỦ (OVR SYSTEM - BIẾN ĐỘNG VÒNG GẦN NHẤT) ==================== */
function calculatePlayerOvrDetails(){
  var details = {};
  for(var t = 0; t < 16; t++){
    for(var p = 0; p < 4; p++){
      var key = t + '_' + p;
      var base = S.teams[t].baseOvr ? (+S.teams[t].baseOvr[p] || 100) : 100;
      details[key] = {
        teamId: t,
        playerIdx: p,
        name: S.teams[t].players[p] || ('Thành viên ' + (p+1)),
        teamTag: S.teams[t].tag,
        baseOvr: base,
        currentOvr: base,
        delta: 0,          // Tổng biến động cả giải
        lastDelta: 0,      // Biến động ở vòng đấu gần nhất
        appearances: 0,
        breakdown: { S:0, A:0, B:0, Bm:0, C:0, D:0 }
      };
    }
  }

var KO_COL_WEIGHTS = [1.1, 1.2, 1.3, 1.4, 1.5];
  var KO_CHRONO_ORDER = ['W1','W2','W3','W4','L1','L2','W5','W6','L3','L4','W7','L5','L6','GF'];

  function processPair(k0, k1, g, weight){
    var wFactor = weight || 1.0;
    var p0 = details[k0], p1 = details[k1];
    if(!p0 || !p1) return;
    var hasPen = (g.a === g.b);
    var w = (g.win === 0) ? p0 : p1;
    var l = (g.win === 0) ? p1 : p0;
    var gd = Math.abs(g.a - g.b);

    var base = hasPen ? 1 : (2 + 0.8 * Math.log(gd));
    var rawWin = base * ovrMult(l.currentOvr - w.currentOvr);
    var winPts = rawWin * wFactor;
    var losePts = -0.75 * rawWin;

    if(hasPen){ w.breakdown.B++; l.breakdown.Bm++; }
    else if(gd >= 3){ w.breakdown.S++; l.breakdown.D++; }
    else { w.breakdown.A++; l.breakdown.C++; }

    [[p0, (g.win === 0 ? winPts : losePts), g.s0], [p1, (g.win === 1 ? winPts : losePts), g.s1]].forEach(function(x){
      var item = x[0];
      var total = r3(x[1] + statBonusOf(x[2]));
      item.appearances++;
      item.delta = r3(item.delta + total);
      item.lastDelta = r3(item.lastDelta + total);
      item.currentOvr = r3(item.currentOvr + total);
    });
  }

  function evaluateMatch(t0, t1, seriesRes, weight){
    if(!seriesRes.games || seriesRes.games.length === 0) return;

    for(var p = 0; p < 4; p++){
      details[t0 + '_' + p].lastDelta = 0;
      details[t1 + '_' + p].lastDelta = 0;
    }

    seriesRes.games.forEach(function(g){
      var k0 = (g.p0 !== null && g.p0 !== undefined) ? (t0 + '_' + g.p0) : null;
      var k1 = (g.p1 !== null && g.p1 !== undefined) ? (t1 + '_' + g.p1) : null;

      if(k0 && k1){
        processPair(k0, k1, g, weight);
      }
    });
  }

  ['R1','R2','R3','R4','R5'].forEach(function(rk){
    (S.swissPairs[rk] || []).forEach(function(pair, idx){
      if(pair && pair[0] !== null && pair[1] !== null && pair[0] !== undefined && pair[1] !== undefined){
        evaluateMatch(pair[0], pair[1], series('sw_' + rk + '_' + idx, 3), 1.0);
      }
    });
  });

  KO_CHRONO_ORDER.forEach(function(id){
    var p = plKO(id);
    var colIdx = POS_KO[id] ? POS_KO[id][0] : 0;
    var w = KO_COL_WEIGHTS[colIdx] || 1.1;
    if(p[0] !== null && p[1] !== null){
      evaluateMatch(p[0], p[1], series('b' + id, needKO(id)), w);
    }
  });

  return details;
}

/* ==================== WHEEL OF NAMES ==================== */
var wheelCandidates = [];
var currentWheelAngle = 0;
var isSpinning = false;
var selectedWheelOpponent = null;

// Hàm tự động xác định nhánh đấu cần bốc thăm tiếp theo
function getDefaultActiveWheelBracket(){
  if(!isR1Completed()) return '';

  var roundOrder = ['R2', 'R3', 'R4', 'R5'];
  var roundCounts = { R2: 8, R3: 8, R4: 6, R5: 3 };

  for(var r = 0; r < roundOrder.length; r++){
    var rk = roundOrder[r];
    var need = roundCounts[rk];
    var doneCount = 0;

    // Kiểm tra số trận đã thi đấu xong của vòng này
    for(var m = 0; m < need; m++){
      if(series('sw_' + rk + '_' + m, 3).done) doneCount++;
    }

    // Nếu vòng này CHƯA đá xong hết: Đây chính là vòng cần bốc thăm / thi đấu!
    if(doneCount < need){
      var specs = SWISS_SPECS[rk] || [];
      var firstIncompleteGroup = null;

      // Ưu tiên chọn nhánh con nào chưa bốc thăm xong
      for(var s = 0; s < specs.length; s++){
        var gk = specs[s].gk;
        var range = getSubGroupSlotRange(rk, gk);
        var isGroupFull = true;

        for(var idx = range.start; idx < range.end; idx++){
          var pair = S.swissPairs[rk] ? S.swissPairs[rk][idx] : null;
          if(!pair || pair[0] === null || pair[1] === null){
            isGroupFull = false;
            break;
          }
        }

        if(!isGroupFull){
          firstIncompleteGroup = rk + '|' + gk;
          break;
        }
      }

      // Nếu tất cả các nhánh trong vòng đều đã bốc xong (đang chờ đá), chọn nhánh đầu tiên của vòng
      return firstIncompleteGroup || (rk + '|' + specs[0].gk);
    }
  }

  return 'R5|2-2';
}

function initWheelSelectOptions(){
  var sel = document.getElementById('wheelBracketSelect');
  if(!sel) return;
  var prev = sel.value;
  sel.innerHTML = '';

  if(!isR1Completed()){
    var opt = document.createElement('option');
    opt.value = '';
    opt.text = '⚠️ Chỉ mở bốc thăm sau khi hoàn thành Vòng 1 (0-0)';
    sel.appendChild(opt);
    return;
  }

  var rounds = ['R2','R3','R4','R5'];
  rounds.forEach(function(rk){
    var grps = getGroupsToDraw(rk);
    Object.keys(grps).forEach(function(gk){
      var opt = document.createElement('option');
      opt.value = rk + '|' + gk;
      opt.text = rk + ' — Nhánh ' + gk;
      sel.appendChild(opt);
    });
  });

  // Tự động tìm nhánh đấu phù hợp theo tiến độ giải
  var targetDefault = getDefaultActiveWheelBracket();

  // Kiểm tra nếu nhánh đã chọn trước đó thuộc về vòng ĐÃ ĐÁ XONG HẾT thì buộc phải nhảy sang vòng mới
  var shouldAdvance = false;
  if(prev){
    var prevRk = prev.split('|')[0];
    var prevCounts = { R2: 8, R3: 8, R4: 6, R5: 3 };
    if(prevCounts[prevRk]){
      var prevDone = 0;
      for(var i = 0; i < prevCounts[prevRk]; i++){
        if(series('sw_' + prevRk + '_' + i, 3).done) prevDone++;
      }
      if(prevDone >= prevCounts[prevRk]){
        shouldAdvance = true; // Vòng cũ đã đá xong hết, tự động nhảy tiếp
      }
    }
  }

  if(!prev || shouldAdvance || !sel.querySelector('option[value="'+prev+'"]')){
    sel.value = targetDefault;
  } else {
    sel.value = prev;
  }
}

function initWheelCandidates(){
  var sel = document.getElementById('wheelBracketSelect');
  if(!sel || !sel.value || !isR1Completed()){
    wheelCandidates = [];
    drawWheel();
    return;
  }
  var parts = sel.value.split('|');
  var rk = parts[0], grpKey = parts[1];

  var allGroups = getGroupsToDraw(rk);
  var teams = allGroups[grpKey] || [];
  var range = getSubGroupSlotRange(rk, grpKey);

  // Lấy danh sách các đội đã có mặt trong nhánh đấu này
  var placedTeams = [];
  var waitingOpponent = null;

  for(var idx = range.start; idx < range.end; idx++){
    var pair = (S.swissPairs && S.swissPairs[rk]) ? S.swissPairs[rk][idx] : null;
    if(pair){
      if(pair[0] !== null && pair[0] !== undefined) placedTeams.push(pair[0]);
      if(pair[1] !== null && pair[1] !== undefined) placedTeams.push(pair[1]);
      
      // Kiểm tra xem có trận nào đang có đội bên trái và chờ đối thủ bên phải không
      if(waitingOpponent === null && pair[0] !== null && pair[0] !== undefined && (pair[1] === null || pair[1] === undefined)){
        waitingOpponent = pair[0];
      }
    }
  }

  // Các đội chưa được xếp vào trận nào
  var available = teams.filter(function(id){ return placedTeams.indexOf(id) < 0; });

  if(waitingOpponent !== null){
    // Nếu đang tìm đối thủ cho đội bên trái: lọc ra các đội chưa từng gặp đội này
    var validCandidates = available.filter(function(id){
      return !havePlayed(waitingOpponent, id);
    });
    wheelCandidates = validCandidates.length > 0 ? validCandidates : available.slice();
  } else {
    // Đang tìm đội mở màn (bên trái) cho trận mới: tất cả các đội còn lại đều hợp lệ
    wheelCandidates = available.slice();
  }

  drawWheel();
}

function resetWheelState(){
  selectedWheelOpponent = null;
  isSpinning = false;
  var spinBtn = document.getElementById('spinBtn');
  if(spinBtn) spinBtn.disabled = false;

  var sel = document.getElementById('wheelBracketSelect');
  if(sel && sel.value){
    var parts = sel.value.split('|');
    var rk = parts[0], grpKey = parts[1];
    var range = getSubGroupSlotRange(rk, grpKey);

    // Xóa các cặp đấu và tỉ số của riêng nhánh con đang chọn
    if(S.swissPairs && S.swissPairs[rk]){
      for(var idx = range.start; idx < range.end; idx++){
        delete S.m['sw_' + rk + '_' + idx];
        delete S.swissPairs[rk][idx];
      }
    }
    save();
    render();
  }

  initWheelCandidates();
}

function shuffleWheelCandidates(){
  if(isSpinning || wheelCandidates.length <= 1) return;
  for(var i = wheelCandidates.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = wheelCandidates[i];
    wheelCandidates[i] = wheelCandidates[j];
    wheelCandidates[j] = tmp;
  }
  drawWheel();
}

function drawWheel(){
  var canvas = document.getElementById('wheelCanvas');
  if(!canvas) return;
  var ctx = canvas.getContext('2d');
  var numSeg = wheelCandidates.length;
  var w = canvas.width, h = canvas.height;
  var radius = w / 2 - 8;
  ctx.clearRect(0,0,w,h);

  if(!isR1Completed()){
    ctx.beginPath();
    ctx.arc(w/2, h/2, radius, 0, Math.PI*2);
    ctx.fillStyle = '#131c2e';
    ctx.fill();
    ctx.fillStyle = '#64748b';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Đang đấu Vòng 1', w/2, h/2 - 8);
    ctx.fillText('(0-0 ghép cố định)', w/2, h/2 + 12);
    return;
  }

  if(numSeg === 0){
    ctx.beginPath();
    ctx.arc(w/2, h/2, radius, 0, Math.PI*2);
    ctx.fillStyle = '#131c2e';
    ctx.fill();
    ctx.fillStyle = '#64748b';
    ctx.font = '13px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Đã ghép hết các đội', w/2, h/2);
    return;
  }

  var step = (Math.PI * 2) / numSeg;

  for(var i = 0; i < numSeg; i++){
    var startAngle = currentWheelAngle + i * step;
    var endAngle = startAngle + step;
    var tid = wheelCandidates[i];

    ctx.beginPath();
    ctx.moveTo(w/2, h/2);
    ctx.arc(w/2, h/2, radius, startAngle, endAngle);
    ctx.fillStyle = (i % 2 === 0) ? '#162238' : '#1c2b45';
    ctx.fill();
    ctx.lineWidth = 1.2;
    ctx.strokeStyle = '#223147';
    ctx.stroke();

    ctx.save();
    ctx.translate(w/2, h/2);
    ctx.rotate(startAngle + step / 2);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#f8fafc';
    ctx.font = 'bold 12px sans-serif';

    var text = tFullName(tid);
    if(text.length > 15) text = text.substring(0, 14) + '…';
    ctx.fillText(text, radius - 28, 4);

    var logoUrl = tLogo(tid);
    if(logoUrl){
      var img = new Image();
      img.src = logoUrl;
      if(img.complete && img.naturalHeight !== 0){
        ctx.drawImage(img, radius - 24, -10, 20, 20);
      }
    }
    ctx.restore();
  }

  ctx.beginPath();
  ctx.arc(w/2, h/2, 22, 0, Math.PI*2);
  ctx.fillStyle = '#ea580c';
  ctx.fill();
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = '#ffffff';
  ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 10px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('SPIN', w/2, h/2 + 3);
}

function spinWheel(){
  if(!isR1Completed()){
    alert('Vòng 1 (nhánh 0-0) đã được ghép cặp mặc định hạt giống! Chỉ bốc thăm khi hoàn thành vòng 1.');
    return;
  }
  if(isSpinning) return;
  if(!wheelCandidates || wheelCandidates.length === 0) return;

  isSpinning = true;
  var spinBtn = document.getElementById('spinBtn');
  if(spinBtn) spinBtn.disabled = true;

  // Tốc độ quay ngẫu nhiên từ 8 đến 16 vòng
  var randomSpins = 8 + Math.floor(Math.random() * 9);
  var randomExtraAngle = Math.random() * Math.PI * 2;
  var totalDistance = randomSpins * Math.PI * 2 + randomExtraAngle;

  var startAngle = currentWheelAngle;
  var targetAngle = startAngle + totalDistance;

  // Thời gian quay đúng 5 giây
  var duration = 5000;
  var startTime = null;

  function easeOut(t) {
    return 1 - Math.pow(1 - t, 4);
  }

  function animate(now){
    if(!startTime) startTime = now;
    var elapsed = now - startTime;
    var progress = Math.min(elapsed / duration, 1);

    currentWheelAngle = startAngle + totalDistance * easeOut(progress);
    drawWheel();

    if(progress < 1){
      requestAnimationFrame(animate);
    } else {
      currentWheelAngle = targetAngle % (Math.PI * 2);
      drawWheel();
      isSpinning = false;
      if(spinBtn) spinBtn.disabled = false;

      var step = (Math.PI * 2) / wheelCandidates.length;
      var pointerAngle = (3 * Math.PI / 2);
      var normAngle = (pointerAngle - currentWheelAngle) % (Math.PI * 2);
      if(normAngle < 0) normAngle += Math.PI * 2;

      var winIdx = Math.floor(normAngle / step) % wheelCandidates.length;
      var picked = wheelCandidates[winIdx];

      // 1. HIỆN POPUP 1 GIÂY THÔNG BÁO ĐỘI VỪA QUAY
      showSpinWinnerPopup(picked);

      // 2. Đưa đội vừa quay trúng vào nhánh đấu ngay lập tức
      assignNextWheelTeam(picked);
    }
  }
  requestAnimationFrame(animate);
}

// Xác định phạm vi vị trí các trận đấu của từng nhánh con
function getSubGroupSlotRange(rk, grpKey){
  var specs = SWISS_SPECS[rk] || [];
  var start = 0;
  for(var i = 0; i < specs.length; i++){
    if(specs[i].gk === grpKey){
      return { start: start, count: specs[i].count, end: start + specs[i].count };
    }
    start += specs[i].count;
  }
  return { start: 0, count: 0, end: 0 };
}

function assignNextWheelTeam(picked){
  var sel = document.getElementById('wheelBracketSelect');
  if(!sel || !sel.value) return;
  var parts = sel.value.split('|');
  var rk = parts[0], grpKey = parts[1];
  var range = getSubGroupSlotRange(rk, grpKey);

  S.swissPairs[rk] = S.swissPairs[rk] || [];

  // Tìm trận đầu tiên chưa hoàn tất trong nhánh
  var targetIdx = -1;
  var targetSide = 0;

  for(var idx = range.start; idx < range.end; idx++){
    var pair = S.swissPairs[rk][idx];
    if(!pair || (pair[0] === null && pair[1] === null)){
      targetIdx = idx;
      targetSide = 0; // Trận hoàn toàn trống -> xếp vào bên trái
      break;
    } else if(pair[0] !== null && (pair[1] === null || pair[1] === undefined)){
      targetIdx = idx;
      targetSide = 1; // Đã có bên trái -> xếp vào bên phải
      break;
    }
  }

  if(targetIdx === -1) return;

  if(!S.swissPairs[rk][targetIdx]) {
    S.swissPairs[rk][targetIdx] = [null, null];
  }

  // Kiểm tra số đội còn lại của nhánh trước khi xếp
  var allGroups = getGroupsToDraw(rk);
  var teams = allGroups[grpKey] || [];
  var placedTeams = [];
  for(var i = range.start; i < range.end; i++){
    var p = S.swissPairs[rk][i];
    if(p){
      if(p[0] !== null && p[0] !== undefined) placedTeams.push(p[0]);
      if(p[1] !== null && p[1] !== undefined) placedTeams.push(p[1]);
    }
  }
  var available = teams.filter(function(id){ return placedTeams.indexOf(id) < 0; });

  // NẾU LÀ CẶP CUỐI CÙNG (bắt đầu xếp bên trái và chỉ còn đúng 2 đội):
  if(targetSide === 0 && available.length === 2){
    // 1. Đội trúng vào bên trái
    S.swissPairs[rk][targetIdx][0] = picked;
    // 2. Đội còn lại tự động vào bên phải
    var remainingTeam = available.find(function(id){ return id !== picked; });
    if(remainingTeam !== undefined){
      S.swissPairs[rk][targetIdx][1] = remainingTeam;
    }
  } else {
    // Các lượt quay bình thường: gán đội vừa quay trúng vào đúng vị trí (trái hoặc phải)
    S.swissPairs[rk][targetIdx][targetSide] = picked;
  }

  save();
  render();
  initWheelCandidates();
}

function renderMatchBox(key, p, needWins, label){
  var r = series(key, needWins);
  var ok = (p[0] !== null && p[1] !== null);
  var op = OPEN[key] && ok;

  // Kiểm tra xem trận đấu đã bắt đầu chưa (đã có tỉ số ván nào chưa)
  var hasStarted = (r.games.length > 0) || (S.m[key] && S.m[key].length > 0);

  function c(j){
    return 'nm' + (r.winner === j ? ' w' : (r.winner === 1 - j && r.winner !== null ? ' l' : ''));
  }

  // Tách thông tin vòng đấu và chỉ số trận từ key (ví dụ: 'sw_R4_3')
  var isSwiss = key.indexOf('sw_') === 0 && key !== 'sw_king';
  var rk = '', matchIdx = '';
  if(isSwiss){
    var kParts = key.split('_');
    rk = kParts[1];
    matchIdx = kParts[2];
  }

  // Render ô đội tuyển có hỗ trợ kéo thả nếu chưa đấu
  function renderTeamSlot(side){
    var tid = p[side];
    var teamHtml = tTagHtml(tid);
    if(isSwiss && !hasStarted){
      return '<span class="drag-slot can-drag" draggable="true" ' +
             'ondragstart="handleTeamDragStart(event, \'' + rk + '\', ' + matchIdx + ', ' + side + ')" ' +
             'ondragover="handleTeamDragOver(event)" ' +
             'ondragleave="handleTeamDragLeave(event)" ' +
             'ondrop="handleTeamDrop(event, \'' + rk + '\', ' + matchIdx + ', ' + side + ')" ' +
             'title="Kéo thả để tự đổi cặp đấu">' + teamHtml + '</span>';
    }
    return '<span class="drag-slot">' + teamHtml + '</span>';
  }

  var h = '<div class="m' + (r.done ? ' done' : '') + '">';
  
  // Header hiển thị tiêu đề và Nút Reset trận lẻ
  h += '<div style="display:flex;align-items:center;justify-content:space-between;padding:4px 8px 0;font-size:11px;color:var(--mu);font-weight:600">';
  h += '<span>' + (label ? label + ' · BO' + (2*needWins-1) : '') + '</span>';
  if(hasStarted){
    h += '<button class="m-reset-btn" onclick="resetSingleMatch(event, \'' + key + '\')" title="Reset kết quả trận này về 0:0">↺ Reset trận</button>';
  }
  h += '</div>';

  h += '<div class="mh' + (ok ? '' : ' off') + '"' + (ok ? ' data-t="' + key + '"' : '') + '>';
  h += '<span class="' + c(0) + '">' + renderTeamSlot(0) + '</span>';
  h += '<b class="sc">' + r.w[0] + ' : ' + r.w[1] + '</b>';
  h += '<span class="' + c(1) + '">' + renderTeamSlot(1) + '</span>';
  h += '<i style="font-style:normal;color:var(--mu);font-size:11px">' + (ok ? (op ? '▾' : '▸') : '') + '</i>';
  h += '</div>';

  if(op) h += gameRows(key, r, p, needWins);
  h += '</div>';
  return h;
}

/* ==================== XỬ LÝ KÉO THẢ XẾP CẶP ĐẤU & RESET TRẬN LẺ ==================== */
var draggedTeamInfo = null;

// Xác định tên nhánh đấu con từ số thứ tự trận đấu
function getSubGroupKeyByMatchIdx(rk, mIdx){
  var specs = SWISS_SPECS[rk] || [];
  var start = 0;
  for(var i = 0; i < specs.length; i++){
    if(mIdx >= start && mIdx < start + specs[i].count){
      return specs[i].gk;
    }
    start += specs[i].count;
  }
  return null;
}

function handleTeamDragStart(e, rk, mIdx, side){
  draggedTeamInfo = { rk: rk, mIdx: +mIdx, side: +side };
  e.dataTransfer.setData('text/plain', JSON.stringify(draggedTeamInfo));
  e.dataTransfer.effectAllowed = 'move';
}

function handleTeamDragOver(e){
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  e.currentTarget.classList.add('drag-over');
}

function handleTeamDragLeave(e){
  e.currentTarget.classList.remove('drag-over');
}

function handleTeamDrop(e, targetRk, targetMIdx, targetSide){
  e.preventDefault();
  e.stopPropagation();
  e.currentTarget.classList.remove('drag-over');

  if(!draggedTeamInfo) return;
  var srcRk = draggedTeamInfo.rk;
  var srcMIdx = draggedTeamInfo.mIdx;
  var srcSide = draggedTeamInfo.side;

  targetMIdx = +targetMIdx;
  targetSide = +targetSide;

  // 1. Kiểm tra cùng một vòng đấu (R1, R2, R3, R4, R5)
  if(srcRk !== targetRk) {
    alert('Chỉ được hoán đổi cặp đấu trong cùng một vòng đấu!');
    draggedTeamInfo = null;
    return;
  }

  // 2. RÀNG BUỘC MỚI: Chỉ được hoán đổi trong cùng một nhánh đấu con (ví dụ 1-2 chỉ kéo sang 1-2)
  var srcGrp = getSubGroupKeyByMatchIdx(srcRk, srcMIdx);
  var targetGrp = getSubGroupKeyByMatchIdx(targetRk, targetMIdx);

  if(srcGrp !== targetGrp){
    alert('Không thể kéo sang nhánh đấu khác! (' + srcGrp + ' ➔ ' + targetGrp + ')');
    draggedTeamInfo = null;
    return;
  }

  // Nếu cùng một ô thì không cần tráo
  if(srcMIdx === targetMIdx && srcSide === targetSide){
    draggedTeamInfo = null;
    return;
  }

  // Khóa: Không cho kéo thả nếu một trong 2 trận đã bắt đầu thi đấu
  var srcKey = 'sw_' + srcRk + '_' + srcMIdx;
  var targetKey = 'sw_' + targetRk + '_' + targetMIdx;
  var srcStarted = series(srcKey, 3).games.length > 0;
  var targetStarted = series(targetKey, 3).games.length > 0;

  if(srcStarted || targetStarted){
    alert('Không thể kéo thả vì một trong hai trận đấu đã có tỉ số!');
    draggedTeamInfo = null;
    return;
  }

  // Tiến hành hoán đổi 2 vị trí trong S.swissPairs
  S.swissPairs[srcRk] = S.swissPairs[srcRk] || [];
  S.swissPairs[targetRk] = S.swissPairs[targetRk] || [];

  if(!S.swissPairs[srcRk][srcMIdx]) S.swissPairs[srcRk][srcMIdx] = [null, null];
  if(!S.swissPairs[targetRk][targetMIdx]) S.swissPairs[targetRk][targetMIdx] = [null, null];

  var temp = S.swissPairs[srcRk][srcMIdx][srcSide];
  S.swissPairs[srcRk][srcMIdx][srcSide] = S.swissPairs[targetRk][targetMIdx][targetSide];
  S.swissPairs[targetRk][targetMIdx][targetSide] = temp;

  save();
  render();
  initWheelCandidates();
  draggedTeamInfo = null;
}

// Nút reset kết quả cho từng trận lẻ
function resetSingleMatch(e, key){
  if(e) e.stopPropagation(); // Không kích hoạt đóng/mở trận đấu
  if(confirm('Bạn có chắc muốn xóa tỉ số và reset kết quả của trận đấu này?')){

    save();
    render();
  }
}

function getSwissDayProgress(dayObj){
  var total = 0, done = 0;
  dayObj.sections.forEach(function(sec){
    if(sec.isKing){
      total += 1;
      if(series('sw_king', 3).done) done++;
    } else {
      total += sec.indices.length;
      sec.indices.forEach(function(idx){
        if(series('sw_' + sec.rk + '_' + idx, 3).done) done++;
      });
    }
  });
  return { done: done, total: total };
}

function getDefaultActiveSwissDay(){
  for(var i = 0; i < SWISS_DAYS.length; i++){
    var d = SWISS_DAYS[i];
    var prog = getSwissDayProgress(d);
    if(prog.done < prog.total) return d.k;
  }
  return 'D9';
}

function clearSwissDayPairs(dayKey){
  var dayObj = SWISS_DAYS.find(function(x){ return x.k === dayKey; });
  if(!dayObj) return;
  if(!confirm('Bạn có chắc muốn xóa kết quả / bốc thăm lại các trận của ' + dayObj.name + '?')) return;

  dayObj.sections.forEach(function(sec){
    if(sec.isKing){
      delete S.m['sw_king'];
    } else if(sec.rk === 'R1'){
      sec.indices.forEach(function(idx){
        delete S.m['sw_R1_' + idx];
        if(!S.swissPairs.R1) S.swissPairs.R1 = DEFAULT_R1_PAIRS.slice();
        S.swissPairs.R1[idx] = DEFAULT_R1_PAIRS[idx].slice();
      });
    } else {
      sec.indices.forEach(function(idx){
        delete S.m['sw_' + sec.rk + '_' + idx];
        if(S.swissPairs && S.swissPairs[sec.rk]){
          delete S.swissPairs[sec.rk][idx];
        }
      });
    }
  });

  save();
  render();
  initWheelCandidates();
}

var M_KO = {
  W1:['RK:1','RK:8'], W2:['RK:4','RK:5'], W3:['RK:2','RK:7'], W4:['RK:3','RK:6'],
  W5:['W:W1','W:W2'], W6:['W:W3','W:W4'], W7:['W:W5','W:W6'],
  L1:['L:W1','L:W2'], L2:['L:W3','L:W4'], L3:['L:W6','W:L1'], L4:['L:W5','W:L2'],
  L5:['W:L3','W:L4'], L6:['L:W7','W:L5'],
  GF:['W:W7','W:L6']
};
var BO_KO = {W1:5,W2:5,W3:5,W4:5,W5:5,W6:5,W7:5,L1:5,L2:5,L3:5,L4:5,L5:5,L6:5,GF:7};
var NUM_KO = {W1:1,W2:2,W3:3,W4:4,W5:5,W6:6,W7:11,L1:7,L2:8,L3:9,L4:10,L5:12,L6:13,GF:14};
var CW=220,CH=58,STEP=260,T0=340;
var POS_KO = {
  W1:[0,0], W2:[0,70], W3:[0,140], W4:[0,210],
  W5:[1,35], W6:[1,175], W7:[2,105],
  L1:[0,T0], L2:[0,T0+80], L3:[1,T0], L4:[1,T0+80], L5:[2,T0+40], L6:[3,T0+40],
  GF:[4,(105+T0+40)/2]
};

function needKO(id){ return (BO_KO[id]+1)/2; }

function getPlayoffSeed(rankNum){
  var ranked = getRankedStandings();
  var qualifiedCount = ranked.filter(function(x){ return x.status === 'qualified'; }).length;
  if(qualifiedCount < 8) return null;
  var idx = rankNum - 1;
  return ranked[idx] ? ranked[idx].id : null;
}

function resolveKOSlot(slot){
  var t = slot.split(':');
  if(t[0] === 'RK') return getPlayoffSeed(+t[1]);
  if(t[0] === 'W') return outKO(t[1]).w;
  if(t[0] === 'L') return outKO(t[1]).l;
  return null;
}

function plKO(id){
  return [resolveKOSlot(M_KO[id][0]), resolveKOSlot(M_KO[id][1])];
}

function outKO(id){
  var p = plKO(id);
  if(p[0] === null || p[1] === null) return {w:null, l:null};
  var r = series('b'+id, needKO(id));
  if(!r.done) return {w:null, l:null};
  return {w: p[r.winner], l: p[1-r.winner]};
}

function srcLabel(s){
  var t = s.split(':');
  if(t[0]==='RK') return 'Top ' + t[1];
  return 'M' + NUM_KO[t[1]] + '-' + t[0];
}

// Phân chia 8 đợt thi đấu theo đúng thứ tự: M1-M4 -> M7-M8 -> M5-M6 -> M9-M10 -> M11 -> M12 -> M13 -> M14
var KO_STAGES = [
  ['W1','W2','W3','W4'], // Đợt 1: M1 - M4
  ['L1','L2'],           // Đợt 2: M7 - M8
  ['W5','W6'],           // Đợt 3: M5 - M6
  ['L3','L4'],           // Đợt 4: M9 - M10
  ['W7'],                // Đợt 5: M11
  ['L5'],                // Đợt 6: M12
  ['L6'],                // Đợt 7: M13
  ['GF']                 // Đợt 8: M14
];

function isKOUnlocked(id){
  for(var s = 0; s < KO_STAGES.length; s++){
    if(KO_STAGES[s].indexOf(id) >= 0){
      for(var prev = 0; prev < s; prev++){
        for(var k = 0; k < KO_STAGES[prev].length; k++){
          var pid = KO_STAGES[prev][k];
          if(!series('b' + pid, needKO(pid)).done) return false;
        }
      }
      return true;
    }
  }
  return true;
}

var CPK = (window.FV_SEASON === 'summer') ? 1.5 : 1, SEASON = window.FV_SEASON || 'spring';
var CP_SPRING = [100, 80, 60, 50, 30, 20, 0].map(function(x){ return x * CPK; }), CP_RANK = ['1', '2', '3', '4', '5-6', '7-8', '9-16'];
function publishSpringResult(){
  var nn = function(x){ return x !== null && x !== undefined; };
  var go = outKO('GF');
  var fixedTiers = [ nn(go.w) ? [go.w] : [], nn(go.l) ? [go.l] : [], [outKO('L6').l].filter(nn), [outKO('L5').l].filter(nn),
                     [outKO('L3').l, outKO('L4').l].filter(nn), [outKO('L1').l, outKO('L2').l].filter(nn) ];
  var tierOf = {};
  fixedTiers.forEach(function(t, k){ t.forEach(function(tid){ tierOf[tid] = k; }); });

  var swissStats = getSwissStats();
  function getWorstTier(tid){
    if(tierOf[tid] !== undefined) return tierOf[tid];
    var worst = 6; // Hạng 9-16 (0 CP)
    if(swissStats[tid] && swissStats[tid].status === 'qualified') worst = 5; // Đã qua Swiss -> tối thiểu Hạng 7-8 (20 CP Spring / 30 CP Summer)
    function chk(mIds, gTier){
      mIds.forEach(function(mid){
        var p = plKO(mid);
        if(p[0] === tid || p[1] === tid) worst = Math.min(worst, gTier);
      });
    }
    chk(['W1','W2','W3','W4','L1','L2'], 5); // Tối thiểu Hạng 7-8
    chk(['W5','W6','L3','L4'], 4);           // Tối thiểu Hạng 5-6
    chk(['L5'], 3);                          // Tối thiểu Hạng 4
    chk(['W7','L6'], 2);                     // Tối thiểu Hạng 3
    chk(['GF'], 1);                          // Tối thiểu Hạng 2
    return worst;
  }

  var buckets = [[], [], [], [], [], [], []];
  for(var tid = 0; tid < 16; tid++){
    buckets[getWorstTier(tid)].push(tid);
  }

  var res = [];

}

function normKey(n){ return String(n || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/gi, 'd').toLowerCase().replace(/\s+/g, ' ').trim(); }

function drawPrizeAndStandings(){
  var go = outKO('GF'), champ = null, second = null;

  var third = outKO('L6').l;
  var fourth = outKO('L5').l;

  var l3Loss = outKO('L3').l, l4Loss = outKO('L4').l;
  var rank5to6 = [l3Loss, l4Loss].filter(function(x){ return x !== null; });

  var l1Loss = outKO('L1').l, l2Loss = outKO('L2').l;
  var rank7to8 = [l1Loss, l2Loss].filter(function(x){ return x !== null; });

  var swissStats = getSwissStats();
  var eliminatedSwiss = swissStats.filter(function(p){
    return p.status === 'eliminated';
  }).map(function(p){ return p.id; });

  var tiers = [
    champ !== null ? [champ] : [],
    second !== null ? [second] : [],
    third !== null ? [third] : [],
    fourth !== null ? [fourth] : [],
    rank5to6,
    rank7to8,
    eliminatedSwiss
  ];

  // Kiểm tra đội thắng King of Swiss
  var kosTeams = swissStats.filter(function(t){ return t.mw === 3 && t.ml === 0; }).map(function(t){ return t.id; });
  var kosSeries = series('sw_king', 3);
  var kingWinner = null;
  if(kosSeries.done && kosTeams.length >= 2){
    kingWinner = (kosSeries.winner === 0 ? kosTeams[0] : kosTeams[1]);
  }

  // Tính tiền thưởng đội: Thưởng thứ hạng + (Thắng Swiss x 3 triệu) + (King of Swiss 50 triệu)
  var teamPrize = Array(16).fill(0);
  tiers.forEach(function(t, k){
    t.forEach(function(tid){
      if(tid !== null){
        var sWin = (swissStats[tid] ? swissStats[tid].mw : 0);
        var kingBonus = (tid === kingWinner ? 40000000 : 0);
        teamPrize[tid] += PRIZE[k][1] + (sWin * 3000000) + kingBonus;
      }

  tiers.forEach(function(teamList){

        var prA = teamPrize[idA] || 0;

        if(prA !== prB) return prB - prA;

        // 2. Hiệu số trận (thắng - thua)
        var mDiffA = statA.mw - statA.ml;
        var mDiffB = statB.mw - statB.ml;
        if(mDiffA !== mDiffB) return mDiffB - mDiffA;

        // 3. Số trận thắng

        // 4. Hiệu số bàn thắng (bàn thắng - bàn thua)
