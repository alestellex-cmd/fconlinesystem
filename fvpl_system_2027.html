</style></head><body><div id="app"></div>
<script>
var AS = 'assummer', YEAR = window.FV_YEAR || 2027, KEY = 'allstar_state_v1';
var GL = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
var BONUS = { '1': 15, '2': 10.5, '3': 7.5, '4': 5.5, '5-6': 4, '7-8': 2.5, '9-16': 1.5, '17-32': 0 };
var PRIZE = { '1': 200, '2': 100, '3': 60, '4': 40, '5-6': 35, '7-8': 35, '9-16': 20, '17-32': 0 }; // triệu VNĐ / người
var TIERS = [
  ['1', 'Vô địch', 1], ['2', 'Á quân', 1], ['3', 'Hạng 3', 1], ['4', 'Hạng 4', 1],
  ['5-6', 'Hạng 5–6', 2], ['7-8', 'Hạng 7–8', 2], ['9-16', 'Hạng 9–16', 8], ['17-32', 'Hạng 17–32', 16]
];
var ORDNUM = { '1': 1, '2': 2, '3': 3, '4': 4, '5-6': 5, '7-8': 7, '9-16': 9, '17-32': 17 };

function fresh(){ return { ov: {}, mode: 'random', grp: [[], [], [], [], [], [], [], []], gp: {}, ko: null, po: null, m: {} }; }
var S = (function(){
  try{ var s = JSON.parse(localStorage.getItem(KEY)); if(s && s.m && s.grp) return s; }catch(e){}
  return fresh();
})();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function F(){ try{ return window.parent.FV; }catch(e){ return null; } }
function sh(t){ try{ var f = F(); return f ? f.shared(t) : null; }catch(e){ return null; } }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function normKey(n){ return String(n || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/gi, 'd').toLowerCase().replace(/\s+/g, ' ').trim(); }
function shuffle(a){ for(var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function rnd(a){ return a[Math.floor(Math.random() * a.length)]; }
function nn(x){ return x !== null && x !== undefined; }
function fmtB(x){ return (x > 0 ? '+' : '') + String(x).replace('.', ','); }

/* ===== 32 TUYỂN THỦ: 8 đội top 8 FVPL Summer × 4 người ===== */
function summerTeams(){
  var d = sh('summer');
  if(!d || !d.done || !d.results) return [];
  return d.results.filter(function(r){ return +r.order >= 1 && +r.order <= 8; }).sort(function(a, b){ return a.order - b.order; }).slice(0, 8);
}
function rosterMap(){
  var map = {};
  try{
    var L = window.parent.localStorage;
    ['spring', 'summer'].forEach(function(ss){
      var raw = L.getItem('FVSYS:' + YEAR + ':' + ss + ':fvpl_season_data_' + ss + '_' + YEAR);
      if(!raw) return;
      (JSON.parse(raw).teams || []).forEach(function(tm){
        var tTag = tm.tag || tm.name || '';
        (tm.players || []).forEach(function(pn){ var pk = normKey(pn); if(pk && tTag) map[pk] = { team: tTag, logo: tm.logo || '' }; });
      });
    });
  }catch(e){}
  return map;
}
function participants(){
  var teams = summerTeams(), map = rosterMap(), out = [];
  for(var i = 0; i < 32; i++){
    var t = teams[Math.floor(i / 4)], auto = (t && t.players) ? (t.players[i % 4] || '') : '';
    var hasOv = S.ov[i] !== undefined, name = hasOv ? S.ov[i] : auto;
    var info = map[normKey(name)] || { team: '', logo: '' };
    if(!hasOv && t) info = { team: t.tag || t.name || '', logo: t.logo || '' };
    out.push({ name: name || '', team: info.team, logo: info.logo, tkey: normKey(info.team) || ('#' + i), auto: !hasOv, seed: t ? +t.order : null, slot: i });
  }
  return out;
}
function nmHtml(P, i){
  if(!nn(i) || !P[i]) return '<span class="mu">TBD</span>';
  var p = P[i], lg = p.logo ? '<img class="lg" src="' + esc(p.logo) + '" alt="" onerror="this.style.display=\'none\'">' : '';
  return '<span class="pl" title="' + esc(p.team || '') + '">' + lg + '<span>' + esc(p.name || ('#' + (i + 1))) + '</span></span>';
}

/* ===== KẾT QUẢ TRẬN ===== */
function mres(key, need){
  var m = S.m[key] || {}, g = m.g || [], w = [0, 0], gf = [0, 0], winner = null, games = [];
  for(var i = 0; i < 2 * need - 1 && winner === null; i++){
    var x = g[i]; if(!x || !nn(x[0]) || !nn(x[1])) continue;
    var a = +x[0], b = +x[1], win = a > b ? 0 : (b > a ? 1 : null);
    if(win === null && nn(x[2]) && nn(x[3]) && +x[2] !== +x[3]) win = (+x[2] > +x[3]) ? 0 : 1;
    if(win === null) continue;
    w[win]++; gf[0] += a; gf[1] += b; games.push({ a: a, b: b, win: win });
    if(w[win] >= need) winner = win;
  }
  return { w: w, gf: gf, winner: winner, done: winner !== null, games: games };
}

/* ===== BỐC THĂM CHIA BẢNG (ràng buộc khác đội + kiểm tra khả thi bằng luồng cực đại) ===== */
function placedSet(){ var s = {}; S.grp.forEach(function(g){ g.forEach(function(p){ s[p] = 1; }); }); return s; }
function remaining(){ var s = placedSet(), r = []; for(var i = 0; i < 32; i++) if(!s[i]) r.push(i); return r; }
function drawnCount(){ return 32 - remaining().length; }
function groupOf(pid){ for(var g = 0; g < 8; g++) if(S.grp[g].indexOf(pid) >= 0) return g; return -1; }
function nextGroup(){ for(var g = 0; g < 8; g++) if(S.grp[g].length < 4) return g; return -1; }

// Có thể xếp phần còn lại vào các bảng sao cho mỗi bảng 4 người khác đội hay không
function feasible(groups, rem, P){
  var need = groups.map(function(g){ return 4 - g.length; });
  var total = need.reduce(function(a, b){ return a + b; }, 0);
  if(total !== rem.length) return false;
  var tc = {}; rem.forEach(function(p){ tc[P[p].tkey] = (tc[P[p].tkey] || 0) + 1; });
  var teams = Object.keys(tc), T = teams.length, G = groups.length, N = T + G + 2, s = 0, t = N - 1;
  var cap = []; for(var i = 0; i < N; i++){ cap.push([]); for(var j = 0; j < N; j++) cap[i].push(0); }
  teams.forEach(function(k, ti){
    cap[s][1 + ti] = tc[k];
    groups.forEach(function(g, gi){
      var has = g.some(function(m){ return P[m].tkey === k; });
      if(!has) cap[1 + ti][1 + T + gi] = 1;
    });
  });
  groups.forEach(function(g, gi){ cap[1 + T + gi][t] = need[gi]; });
  var flow = 0;
  while(true){
    var prev = []; for(var q = 0; q < N; q++) prev.push(-1);
    prev[s] = s; var queue = [s];
    while(queue.length && prev[t] < 0){
      var u = queue.shift();
      for(var v = 0; v < N; v++) if(prev[v] < 0 && cap[u][v] > 0){ prev[v] = u; queue.push(v); }
    }
    if(prev[t] < 0) break;
    var f = 1e9, x = t; while(x !== s){ f = Math.min(f, cap[prev[x]][x]); x = prev[x]; }
    x = t; while(x !== s){ cap[prev[x]][x] -= f; cap[x][prev[x]] += f; x = prev[x]; }
    flow += f;
  }
  return flow === total;
}
function validCandidates(g, P){
  var rem = remaining(), res = [];
  rem.forEach(function(c){
    if(S.grp[g].some(function(m){ return P[m].tkey === P[c].tkey; })) return;
    var gs = S.grp.map(function(a){ return a.slice(); }); gs[g].push(c);
    if(feasible(gs, rem.filter(function(x){ return x !== c; }), P)) res.push(c);
  });
  return res;
}
function playersReady(P){ return P.every(function(p){ return p.name; }); }

var BUSY = false;
function spinReveal(cands, P, title, done){
  if(BUSY) return;
  BUSY = true;
  var el = document.createElement('div'); el.className = 'as-modal-bg';
  el.innerHTML = '<div class="spin-box"><div class="spin-t">' + esc(title) + '</div><div class="spin-n" id="spinN">…</div></div>';
  document.body.appendChild(el);
  var pick = rnd(cands), n = 0, total = 16, nEl = document.getElementById('spinN');
  (function tick(){
    n++;
    if(n < total){ nEl.textContent = P[rnd(cands)].name; setTimeout(tick, 55 + n * 9); }
    else {
      nEl.textContent = P[pick].name; nEl.className = 'spin-n win';
      setTimeout(function(){ document.body.removeChild(el); BUSY = false; done(pick); }, 650);
    }
  })();
}
function drawRandomOne(){
  var P = participants(), g = nextGroup(); if(g < 0 || BUSY) return;
  var c = validCandidates(g, P); if(!c.length){ alert('Không còn lựa chọn hợp lệ. Hãy hoàn tác hoặc đặt lại bốc thăm.'); return; }
  spinReveal(c, P, 'Bảng ' + GL[g] + ' · người thứ ' + (S.grp[g].length + 1), function(pick){ S.grp[g].push(pick); save(); render(); });
}
function drawRandomAll(){
  if(BUSY) return;
  var P = participants();
  (function step(){
    var g = nextGroup(); if(g < 0){ BUSY = false; save(); render(); return; }
    BUSY = true;
    var c = validCandidates(g, P);
    if(!c.length){ BUSY = false; alert('Không còn lựa chọn hợp lệ. Hãy đặt lại bốc thăm.'); render(); return; }
    S.grp[g].push(rnd(c)); save(); render();
    setTimeout(step, 90);
  })();
}
function pickPlayer(pid){
  var P = participants(), g = nextGroup(); if(g < 0 || BUSY) return;
  if(validCandidates(g, P).indexOf(pid) < 0) return;
  S.grp[g].push(pid); save(); render();
}
function undoPick(){
  if(BUSY) return;
  for(var g = 7; g >= 0; g--) if(S.grp[g].length){ if(groupLocked(g)){ alert('Bảng này đã có kết quả, không thể hoàn tác.'); return; } S.grp[g].pop(); delete S.gp[g]; save(); render(); return; }
}
function groupLocked(g){
  return Object.keys(S.m).some(function(k){ return k.indexOf('g' + g + '_') === 0; }) || !!S.ko || !!S.po;
}
function setMode(m){ if(S.mode === m) return; if(drawnCount() > 0 && !confirm('Đổi hình thức sẽ xoá toàn bộ kết quả bốc thăm hiện tại. Tiếp tục?')) { render(); return; } if(drawnCount() > 0) resetDraw(true); S.mode = m; save(); render(); }
function resetDraw(silent){
  if(!silent && !confirm('Xoá toàn bộ bốc thăm bảng, kết quả vòng bảng, Knock-out và Playoff?')) return;
  S.grp = [[], [], [], [], [], [], [], []]; S.gp = {}; S.ko = null; S.po = null; S.m = {};
  save(); if(!silent) render();
}
function setName(i, v){
  v = v.trim();
  if(v){
    var P = participants();
    for(var k = 0; k < 32; k++) if(k !== i && normKey(P[k].name) === normKey(v)){ alert('Tuyển thủ "' + v + '" đã có trong danh sách (ô #' + (k + 1) + ').'); render(); return; }
  }
  S.ov[i] = v; save(); render();
}
function resetAuto(){ S.ov = {}; save(); render(); }

/* ===== VÒNG BẢNG: GSL (nhánh trên / nhánh dưới, BO3) ===== */
function drawPairs(g){
  if(S.grp[g].length !== 4 || groupLocked(g)) return;
  var a = shuffle(S.grp[g].slice()); S.gp[g] = [[a[0], a[1]], [a[2], a[3]]]; save(); render();
}
function drawAllPairs(){
  for(var g = 0; g < 8; g++) if(S.grp[g].length === 4 && !(S.gp[g]) ) drawPairs(g);
}
function gres(g){
  var pr = S.gp[g]; if(!pr) return null;
  function r(key, a, b){
    if(!nn(a) || !nn(b)) return { s: [a, b], w: null, l: null, done: false };
    var x = mres('g' + g + '_' + key, 2), s = [a, b];
    return { s: s, w: x.winner === null ? null : s[x.winner], l: x.winner === null ? null : s[1 - x.winner], done: x.done };
  }
  var u1 = r('U1', pr[0][0], pr[0][1]), u2 = r('U2', pr[1][0], pr[1][1]);
  var uf = r('UF', u1.w, u2.w), l1 = r('L1', u1.l, u2.l), lf = r('LF', uf.l, l1.w);
  return { U1: u1, U2: u2, UF: uf, L1: l1, LF: lf, first: uf.w, second: lf.w, done: uf.done && lf.done };
}
function allGroupsDone(){ for(var g = 0; g < 8; g++){ var G = gres(g); if(!G || !G.done) return false; } return true; }

function gBox(g, key, a, b, title){
  var P = PCACHE, ok = nn(a) && nn(b), r = ok ? mres('g' + g + '_' + key, 2) : { w: [0, 0], winner: null, done: false };
  function row(j, id){
    return '<div class="gr2' + (r.winner === j ? ' w' : (r.winner !== null ? ' l' : '')) + '"><span class="fl">🇻🇳</span><span class="nmx">' + nmHtml(P, id) + '</span><b>' + (ok ? r.w[j] : '') + '</b></div>';
  }
  return '<div class="gm' + (r.done ? ' done' : '') + (ok ? ' ok' : '') + '"' + (ok ? ' onclick="openScore(\'g' + g + '_' + key + '\',' + a + ',' + b + ',2,\'Bảng ' + GL[g] + ' · ' + title + '\')"' : '') + '>' + row(0, a) + row(1, b) + '</div>';
}
function qBox(pid){
  var P = PCACHE;
  return '<div class="gm q">' + (nn(pid) ? '<div class="gr2"><span class="fl">🇻🇳</span><span class="nmx">' + nmHtml(P, pid) + '</span></div>' : '<div class="gr2"><span class="mu">&nbsp;</span></div>') + '</div>';
}
function groupBracket(g){
  var G = gres(g);
  var h = '<div class="gcard"><div class="ghd"><span>Bảng ' + GL[g] + '</span><span class="mu">' + S.grp[g].map(function(p){ return esc(PCACHE[p].name); }).join(' · ') + '</span></div>';
  if(!G){
    h += '<div class="mu" style="padding:10px">' + (S.grp[g].length === 4 ? 'Chưa quay cặp đấu.' : 'Chờ bốc thăm đủ 4 tuyển thủ (' + S.grp[g].length + '/4).') + '</div></div>';
    return h;
  }
  h += '<div class="g3"><div class="gh">Upper Bracket Semifinals</div><div class="gh">Upper Bracket Final</div><div class="gh">Qualified</div>' +
       '<div class="gc"><div>' + gBox(g, 'U1', G.U1.s[0], G.U1.s[1], 'Nhánh trên · Bán kết 1') + '</div><div>' + gBox(g, 'U2', G.U2.s[0], G.U2.s[1], 'Nhánh trên · Bán kết 2') + '</div></div>' +
       '<div class="gc mid">' + gBox(g, 'UF', G.UF.s[0], G.UF.s[1], 'Nhánh trên · Chung kết') + '</div>' +
       '<div class="gc mid">' + qBox(G.first) + '</div>' +
       '<div class="gh">Lower Bracket Semifinals</div><div class="gh">Lower Bracket Final</div><div class="gh">Qualified</div>' +
       '<div class="gc mid">' + gBox(g, 'L1', G.L1.s[0], G.L1.s[1], 'Nhánh dưới · Bán kết') + '</div>' +
       '<div class="gc mid">' + gBox(g, 'LF', G.LF.s[0], G.LF.s[1], 'Nhánh dưới · Chung kết') + '</div>' +
       '<div class="gc mid">' + qBox(G.second) + '</div></div></div>';
  return h;
}

/* ===== KNOCK-OUT: 8 nhất bảng gặp 8 nhì bảng (BO5) ===== */
function drawKO(){
  if(!allGroupsDone() || S.ko || BUSY) return;
  var wins = [], runs = [];
  for(var g = 0; g < 8; g++){ var G = gres(g); wins.push(G.first); runs.push(G.second); }
  shuffle(wins);
  var best = null;
  for(var t = 0; t < 2000; t++){
    var r = shuffle(runs.slice()), ok = true;
    for(var i = 0; i < 8; i++) if(groupOf(wins[i]) === groupOf(r[i])){ ok = false; break; }
    if(ok){ best = r; break; }
  }
  if(!best){ alert('Không tìm được cách ghép hợp lệ.'); return; }
  S.ko = wins.map(function(w, i){ return [w, best[i]]; }); save(); render();
}
function resetKO(){
  if(!confirm('Xoá bốc thăm Knock-out, Playoff và toàn bộ kết quả của chúng?')) return;
  Object.keys(S.m).forEach(function(k){ if(k.indexOf('ko') === 0 || k.indexOf('k_') === 0) delete S.m[k]; });
  S.ko = null; S.po = null; save(); render();
}
function koQualified(){
  if(!S.ko) return [];
  var q = [];
  S.ko.forEach(function(pr, i){ var r = mres('ko' + i, 3); if(r.done) q.push(pr[r.winner]); });
  return q;
}
function koDone(){ return !!S.ko && koQualified().length === 8; }
function koBox(i){
  var P = PCACHE, pr = S.ko[i], r = mres('ko' + i, 3), a = pr[0], b = pr[1];
  function row(j, id){
    return '<div class="gr2' + (r.winner === j ? ' w' : (r.winner !== null ? ' l' : '')) + '"><span class="fl">🇻🇳</span><span class="nmx">' + nmHtml(P, id) + '</span><b>' + r.w[j] + '</b></div>';
  }
  var box = '<div class="gm ok' + (r.done ? ' done' : '') + '" onclick="openScore(\'ko' + i + '\',' + a + ',' + b + ',3,\'Knock-out · Trận ' + (i + 1) + '\')">' + row(0, a) + row(1, b) + '</div>';
  return '<div class="kor">' + box + '<div class="kolink"></div>' + qBox(r.done ? pr[r.winner] : null) + '</div>';
}

/* ===== PLAYOFF: double elimination 8 người, BO5, chung kết tổng BO7 ===== */
var KO_ORDER = ['W1', 'W2', 'W3', 'W4', 'W5', 'W6', 'W7', 'L1', 'L2', 'L3', 'L4', 'L5', 'L6', 'GF'];
var KO_REF = {
  W5: [['w', 'W1'], ['w', 'W2']], W6: [['w', 'W3'], ['w', 'W4']], W7: [['w', 'W5'], ['w', 'W6']],
  L1: [['l', 'W1'], ['l', 'W2']], L2: [['l', 'W3'], ['l', 'W4']], L3: [['l', 'W6'], ['w', 'L1']], L4: [['l', 'W5'], ['w', 'L2']],

  h += '<div class="bar"><b>Hình thức:</b> <button class="' + (S.mode === 'random' ? 'on' : '') + '" onclick="setMode(\'random\')">Quay random toàn bộ</button><button class="' + (S.mode === 'pick' ? 'on' : '') + '" onclick="setMode(\'pick\')">Tự chọn (người trước chọn người sau)</button></div>';
  if(!ready) h += '<div class="mu">Cần đủ tên 32 tuyển thủ trước khi bốc thăm.</div>';
  else if(ng < 0) h += '<div class="ok" style="font-weight:700">✓ Đã chia xong 8 bảng.</div>';
  else if(S.mode === 'random'){
    h += '<div class="bar"><button class="primary" onclick="drawRandomOne()">Quay người kế tiếp (Bảng ' + GL[ng] + ' · người ' + (S.grp[ng].length + 1) + ')</button><button onclick="drawRandomAll()">Quay hết các bảng còn lại</button></div>';
  } else {
    var gl = S.grp[ng];
    if(!gl.length) h += '<div class="bar"><button class="primary" onclick="drawRandomOne()">Quay random người số 1 của Bảng ' + GL[ng] + '</button></div>';
    else {
      var cands = validCandidates(ng, P), picker = gl[gl.length - 1];
      h += '<div style="margin:6px 0"><b>Bảng ' + GL[ng] + '</b> · <b class="fire">' + esc(P[picker].name) + '</b> (người số ' + gl.length + ') chọn người số ' + (gl.length + 1) + ':</div><div class="cgrid">';
      cands.forEach(function(c){ h += '<button onclick="pickPlayer(' + c + ')">' + (P[c].logo ? '<img class="lg" src="' + esc(P[c].logo) + '" alt="" onerror="this.style.display=\'none\'">' : '') + esc(P[c].name) + ' <span class="mu">' + esc(P[c].team) + '</span></button>'; });
      h += '</div><div class="mu" style="font-size:12px;margin-top:6px">Chỉ hiện các tuyển thủ hợp lệ: khác đội với những người trong bảng và vẫn đảm bảo các bảng còn lại xếp được.</div>';
    }
  }
  h += '<div class="gboxes">';
  for(var g = 0; g < 8; g++){
    h += '<div class="gbox' + (g === ng ? ' cur' : '') + '"><div class="gbox-hd">Bảng ' + GL[g] + '<span class="mu">' + S.grp[g].length + '/4</span></div>';
    for(var s = 0; s < 4; s++){
      var pid = S.grp[g][s];
      h += '<div class="gslot">' + (nn(pid) ? '<span class="mu" style="width:18px">' + (s + 1) + '</span>' + nmHtml(P, pid) + '<span class="mu" style="margin-left:auto;font-size:11px">' + esc(P[pid].team) + '</span>' : '<span class="mu">' + (s + 1) + ' · –</span>') + '</div>';
    }
    h += '</div>';
  }
  h += '</div><div class="bar">' + (dn > 0 ? '<button onclick="undoPick()">↶ Hoàn tác lượt bốc gần nhất</button><button onclick="resetDraw()">🗑 Đặt lại bốc thăm</button>' : '') + '</div></div>';

  // 3. Vòng bảng
  h += '<h2>3. Vòng bảng (GSL · BO3)</h2><div class="card">';
  var allDrawn = (ng < 0), anyPairs = Object.keys(S.gp).length;
  if(!allDrawn) h += '<div class="mu">Hoàn thành bốc thăm 8 bảng để quay cặp đấu.</div>';
  else {
    if(anyPairs < 8) h += '<div class="bar"><button class="primary" onclick="drawAllPairs()">Quay random 2 cặp đấu cho ' + (anyPairs ? 'các bảng còn lại' : 'cả 8 bảng') + '</button></div>';
    h += '<div class="ggrid">';
    for(var g2 = 0; g2 < 8; g2++) h += groupBracket(g2);
    h += '</div>';
    h += '<div class="mu" style="margin-top:8px;font-size:12px">Bấm vào từng trận để nhập tỉ số. Nhất bảng và nhì bảng đi tiếp, hai người còn lại bị loại (hạng 17–32).</div>';
  }
  h += '</div>';

  // 4. Knock-out
  h += '<h2>4. Knock-out (BO5)</h2><div class="card">';
  if(!allGroupsDone()) h += '<div class="mu">Hoàn thành vòng bảng để quay Knock-out (16 người → 8 người).</div>';
  else if(!S.ko) h += '<div class="bar"><button class="primary" onclick="drawKO()">Quay random 8 nhất bảng gặp 8 nhì bảng</button><span class="mu" style="font-size:12px">Người cùng bảng sẽ không gặp lại nhau.</span></div>';
  else {
    h += '<div class="kohd"><div class="kh"><span>Round 1</span><span>Qualified</span></div><div class="kh"><span>Round 1</span><span>Qualified</span></div></div><div class="kogrid">';
    for(var k = 0; k < 8; k++) h += koBox(k);
    h += '</div><div class="bar"><button onclick="resetKO()">🗑 Xoá Knock-out &amp; Playoff</button></div>';
  }
  h += '</div>';

  // 5. Playoff
  h += '<h2>5. Playoff (Double Elimination BO5 · Chung kết BO7)</h2><div class="card">';
  if(!koDone()) h += '<div class="mu">Hoàn thành Knock-out để quay random 8 người vào nhánh Playoff.</div>';
  else {
    if(!S.po) h += '<div class="bar"><button class="primary" onclick="drawPlayoff()">Quay random 8 người vào nhánh Playoff</button></div>';
    else h += poHtml(P, poSeeds()) + '<div class="bar"><button onclick="resetPlayoff()">🗑 Xoá Playoff</button></div>';
  }
  h += '</div>';

  h += '<h2>6. Cơ cấu giải thưởng &amp; điểm OVR cộng</h2><div class="card">' + tierTable(P) + '</div>';
  h += '<h2>7. Điều lệ &amp; thể thức</h2>' + RULES;

  var sy = window.scrollY;
  document.getElementById('app').innerHTML = h;
  window.scrollTo(0, sy);
  pub(P);
}
render();

</scr_ipt></body></html>
</script>

<div id="top"><span class="br" data-go="home"><b>FC ONLINE</b> WIKI</span><a data-go="home" style="font-weight:700;font-size:13px">Trang chủ</a><a data-go="transfers" style="font-weight:700;font-size:13px">Thống kê chuyển nhượng</a><span class="sp"></span>

<script>
/* ===== BỘ XỬ LÝ DỮ LIỆU HỒ SƠ (đọc toàn bộ localStorage FVSYS của mọi năm) ===== */
var USD_RATE = 25725.5;
var TOURS = {
  spring:{n:'FVPL Spring',ord:1,kind:'fvpl',lab:'Spring'},
  master:{n:'FC Pro Master',ord:2,kind:'intl',lab:'Master'},
  summer:{n:'FVPL Summer',ord:3,kind:'fvpl',lab:'Summer'},
  champions:{n:'FC Pro Champions',ord:4,kind:'intl',lab:'Champions'},
  asvn:{n:'All-Star VN',ord:5,kind:'as',lab:'All-Star VN'},
  asint:{n:'All-Star International',ord:6,kind:'as',lab:'All-Star INT'},
  assummer:{n:'All-Star Summer',ord:5,kind:'as',lab:'All-Star Summer'}
};
/* Từ 2028: thứ tự & tên giải theo luật mới (2027 giữ nguyên bảng cũ) */
var NEW_ORD = {spring:1,asvn:2,master:3,summer:4,assummer:5,champions:6,asint:7}, NEW_NAME = {asvn:['All-Star Spring','All-Star Spring'], asint:['FC Pro All-Star','FC Pro All-Star']};
var COUNTRY = {VN:['🇻🇳','Việt Nam'],KR:['🇰🇷','Hàn Quốc'],TH:['🇹🇭','Thái Lan'],CN:['🇨🇳','Trung Quốc']};
function normKey(n){ return String(n||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'d').toLowerCase().replace(/\s+/g,''); }
function numv(v){ return (v===undefined||v===null||v===''||isNaN(v)) ? null : +v; }

function buildDB(L, years){
  var DB = { tours:[], teams:{}, players:{}, byId:{} };
  function jget(k){ try{ var v = L.getItem(k); return v ? JSON.parse(v) : null; }catch(e){ return null; } }
  function findKey(prefix){ for(var i=0;i<L.length;i++){ var k = L.key(i); if(k && k.indexOf(prefix)===0) return k; } return null; }

  function ser(m, key, need, group){
    var maxG = group ? 3 : 2*need-1, G = (m && m[key]) || [], w = [0,0], games = [];
    for(var i=0;i<maxG;i++){
      if(!group && (w[0]===need || w[1]===need)) break;
      var g = G[i] || [], a = numv(g[0]), b = numv(g[1]);
      if(a===null || b===null) break;
      var p0 = (g[4]!==undefined && g[4]!=='') ? +g[4] : null, p1 = (g[5]!==undefined && g[5]!=='') ? +g[5] : null;
      var win = null;
      if(a>b) win=0; else if(b>a) win=1;
      else { var pa = numv(g[2]), pb = numv(g[3]); if(pa!==null && pb!==null && pa!==pb) win = pa>pb?0:1; else if(!group) break; }
      if(win!==null) w[win]++;
      games.push({a:a,b:b,win:win,p0:p0,p1:p1});
    }
    var done = group ? games.length===3 : (w[0]===need || w[1]===need);
    return {w:w, done:done, winner:(!group && done) ? (w[0]===need?0:1) : null, games:games};
  }

  var teamAliases = jget('FVSYS:team_aliases') || {}; // Lưu dạng { 'gencity': 'Gen.G' }
  function resolveTeamKey(name){
    var k = normKey(name);
    var visited = {};
    while(k && teamAliases[k] && !visited[k]){
      visited[k] = true;
      k = normKey(teamAliases[k]);
    }
    return k;
  }
  function getTeam(name, tag, logo, country){
    var rawK = normKey(name); if(!rawK) return null;
    var k = resolveTeamKey(name);
    var t = DB.teams[k];
    if(!t) t = DB.teams[k] = {key:k,name:name,tag:tag||name,logo:logo||'',country:country||'VN',oldNames:[],entries:[],series:[]};
    // Nếu tên ở giải này là tên mới nhất (không nằm trong danh sách tên cũ bị đổi đi), cập nhật làm tên hiển thị chính của CLB
    if(!teamAliases[rawK]){
      if(name) t.name = name;
      if(tag) t.tag = tag;
    } else if(name && normKey(name) !== k && t.oldNames.indexOf(name) < 0){
      t.oldNames.push(name);
    }
    if(logo) t.logo = logo;
    if(country) t.country = country;
    return t;
  }
  function getPlayer(name){
    var k = normKey(name); if(!k) return null;
    return DB.players[k] || (DB.players[k] = {key:k,name:String(name).trim(),country:'VN',entries:{},games:[]});
  }
  function mkTour(Y, tab){
    var d = TOURS[tab], nr = Y >= 2028, nm2 = nr && NEW_NAME[tab], T = {id:Y+'_'+tab,year:Y,tab:tab,name:(nm2?nm2[0]:d.n)+' '+Y,lab:(nm2?nm2[1]:d.lab),ord:(nr?NEW_ORD[tab]:d.ord),kind:d.kind,teams:[],series:[],done:false};
    DB.tours.push(T); DB.byId[T.id] = T; return T;
  }
  function entryFor(T, pname){
    var p = getPlayer(pname); if(!p) return null;
    if(!p.entries[T.id]) p.entries[T.id] = {tour:T,player:p,team:null,place:'',order:99,prize:0,ovr:null,st:{gp:0,gw:0,gd:0,gl:0,gf:0,ga:0}};
    return p.entries[T.id];
  }
  function addTeamEntry(T, tm, idx, country){
    var t = getTeam(tm.name, tm.tag, tm.logo, country); if(!t) return null;
    var te = {tour:T,team:t,idx:idx,name:tm.name,tag:tm.tag||tm.name,logo:tm.logo||'',country:country,players:(tm.players||[]).map(function(x){return (x||'').trim();}),place:'',order:99,prize:0};
    t.entries.push(te); T.teams[idx] = te;
    te.players.forEach(function(pn){ if(pn){ var e = entryFor(T, pn); e.team = te; getPlayer(pn).country = country; } });
    return te;
  }
  function addSeries(T, stage, ord, ia, ib, r, group){
    var A = T.teams[ia], B = T.teams[ib]; if(!A || !B || !r.games.length) return;
    var s = {tour:T,stage:stage,ord:ord,A:A,B:B,wA:r.w[0],wB:r.w[1],done:r.done,group:!!group,games:r.games};
    T.series.push(s);
    var gl = [];
    r.games.forEach(function(g,gi){
      var pnA = g.p0!==null ? A.players[g.p0] : '', pnB = g.p1!==null ? B.players[g.p1] : '';
      gl.push({a:g.a,b:g.b,win:g.win,nA:pnA,nB:pnB});
      function rec(pn, me, opp, f, ag, wn, on, gi){
        if(!pn) return; var p = getPlayer(pn), e = entryFor(T, pn);
        p.games.push({tour:T,stage:stage,ord:ord,gi:gi,me:me,opp:opp,oppName:on,f:f,ag:ag,win:wn});
        e.st.gp++; e.st.gf+=f; e.st.ga+=ag; if(wn===1) e.st.gw++; else if(wn===0) e.st.gl++; else e.st.gd++;
      }
      rec(pnA, A, B, g.a, g.b, g.win===0?1:(g.win===1?0:null), pnB, gi);
      rec(pnB, B, A, g.b, g.a, g.win===1?1:(g.win===0?0:null), pnA, gi);
    });
    A.team.series.push({tour:T,stage:stage,ord:ord,me:A,opp:B,wMe:s.wA,wOpp:s.wB,done:r.done,group:!!group,games:gl.map(function(x){return {m:x.nA,o:x.nB,f:x.a,ag:x.b};})});
    B.team.series.push({tour:T,stage:stage,ord:ord,me:B,opp:A,wMe:s.wB,wOpp:s.wA,done:r.done,group:!!group,games:gl.map(function(x){return {m:x.nB,o:x.nA,f:x.b,ag:x.a};})});
  }
  function givePrize(T, te, usd){
    te.prize = usd; var live = te.players.filter(function(x){return x;});
    live.forEach(function(pn){ entryFor(T, pn).prize += usd/4; });
  }
  function awardPlayer(T, nk, usd){ var p = DB.players[nk]; if(p && p.entries[T.id]) p.entries[T.id].prize += usd; }
  function setPlaces(T, sh){
    if(!sh || !sh.results) return;
    sh.results.forEach(function(r){
      var te = null; T.teams.forEach(function(x){ if(x && normKey(x.name)===normKey(r.name)) te = x; });
      if(te){ te.place = r.place; te.order = r.order; }
    });
    if(sh.done) T.done = true;
    (sh.players||[]).forEach(function(pl){
      var e = (DB.players[normKey(pl.name)]||{entries:{}}).entries[T.id];
      if(e && e.st.gp > 0) e.ovr = Math.round((+pl.currentOvr||100)*1000 + (+pl.bonus||0)*1000)/1000;
    });
  }

  var KO_FV = { W1:['RK:1','RK:8'],W2:['RK:4','RK:5'],W3:['RK:2','RK:7'],W4:['RK:3','RK:6'],W5:['W:W1','W:W2'],W6:['W:W3','W:W4'],W7:['W:W5','W:W6'],
    L1:['L:W1','L:W2'],L2:['L:W3','L:W4'],L3:['L:W6','W:L1'],L4:['L:W5','W:L2'],L5:['W:L3','W:L4'],L6:['L:W7','W:L5'],GF:['W:W7','W:L6'] };

var EDIT_TEAM_ALIAS = false;
function toggleTeamAlias(){ EDIT_TEAM_ALIAS = !EDIT_TEAM_ALIAS; render(); }
function addTeamOldName(currentTeamName){
  try{
    var inp = document.getElementById('inp_old_team_name');
    if(!inp || !inp.value.trim()) return;
    var oldName = inp.value.trim();
    var oldK = normKey(oldName), newK = normKey(currentTeamName);
    if(!oldK || oldK === newK){ alert('Tên cũ không hợp lệ hoặc trùng với tên hiện tại!'); return; }
    var P = PW(), al = JSON.parse(P.localStorage.getItem('FVSYS:team_aliases') || '{}');
    al[oldK] = currentTeamName.trim();
    P.localStorage.setItem('FVSYS:team_aliases', JSON.stringify(al));
    EDIT_TEAM_ALIAS = false;
    refresh();
    go('team', currentTeamName, true);
  }catch(e){}
}
function removeTeamOldName(oldKey, currentTeamName){
  try{
    var P = PW(), al = JSON.parse(P.localStorage.getItem('FVSYS:team_aliases') || '{}');
    delete al[oldKey];
    P.localStorage.setItem('FVSYS:team_aliases', JSON.stringify(al));
    refresh();
    go('team', currentTeamName, true);
  }catch(e){}
}

<script>
/* ===== XÁC THỰC ADMIN (chạy hoàn toàn trên trình duyệt) =====
   Mật khẩu KHÔNG lưu dạng chữ thường mà lưu dưới dạng mã băm SHA-256 (ADMIN_HASH).
   Đổi mật khẩu: tính SHA-256 của chuỗi  fvpl-admin|<tài khoản viết thường>|<mật khẩu>  rồi thay vào ADMIN_HASH. */
var ADMIN_HASH = '0bb512e1e319977a1dd9e684d539197b22d285004b92ece3599768331dd3cec9';
function sha256(str){
  str = unescape(encodeURIComponent(str));
  function rr(v, a){ return (v >>> a) | (v << (32 - a)); }
  var mp = Math.pow, mw = mp(2, 32), i, j, result = '', words = [], bl = str.length * 8;
  var hash = [], k = [], pc = 0, comp = {};
  for(var c = 2; pc < 64; c++){ if(!comp[c]){ for(i = 0; i < 313; i += c) comp[i] = c; hash[pc] = (mp(c, .5) * mw) | 0; k[pc++] = (mp(c, 1 / 3) * mw) | 0; } }
  str += '\x80'; while(str.length % 64 - 56) str += '\x00';
  for(i = 0; i < str.length; i++){ j = str.charCodeAt(i); words[i >> 2] |= j << ((3 - i) % 4) * 8; }
  words[words.length] = ((bl / mw) | 0); words[words.length] = (bl);
  for(j = 0; j < words.length;){
    var w = words.slice(j, j += 16), oh = hash; hash = hash.slice(0, 8);
    for(i = 0; i < 64; i++){
      var w15 = w[i - 15], w2 = w[i - 2], a = hash[0], e = hash[4];
      var t1 = hash[7] + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & hash[5]) ^ ((~e) & hash[6])) + k[i] + (w[i] = (i < 16) ? w[i] : (w[i - 16] + (rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3)) + w[i - 7] + (rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10))) | 0);
      var t2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
      hash = [(t1 + t2) | 0].concat(hash); hash[4] = (hash[4] + t1) | 0;
    }
    for(i = 0; i < 8; i++) hash[i] = (hash[i] + oh[i]) | 0;
  }
  for(i = 0; i < 8; i++) for(j = 3; j + 1; j--){ var b = (hash[i] >> (j * 8)) & 255; result += ((b < 16) ? 0 : '') + b.toString(16); }
  return result;
}
var Auth = (function(){
  var fails = 0, lockUntil = 0, KEY = 'FV_ADMIN_SESSION';
  var role = 'user';
  try{ if(sessionStorage.getItem(KEY) === ADMIN_HASH) role = 'admin'; }catch(e){}
  document.body.className = 'role-' + role;
  document.getElementById('roleLine').textContent = role === 'admin' ? 'Chế độ quản trị · toàn quyền chỉnh sửa' : 'Cổng thông tin giải đấu';
  var api = { role: role };

  api.close = function(){ document.getElementById('lgBg').className = 'lg-bg'; };
  api.submit = function(){
    var err = document.getElementById('lgErr'), now = Date.now();
    if(now < lockUntil){ err.textContent = 'Thử sai nhiều lần, vui lòng đợi ' + Math.ceil((lockUntil - now) / 1000) + ' giây.'; return; }
    var u = document.getElementById('lgUser').value.trim().toLowerCase(), p = document.getElementById('lgPass').value;
    if(sha256('fvpl-admin|' + u + '|' + p) === ADMIN_HASH){
      try{ sessionStorage.setItem(KEY, ADMIN_HASH); }catch(e){}
      location.reload();
    } else {
      fails++; err.textContent = 'Sai tài khoản hoặc mật khẩu.';
      if(fails >= 5){ lockUntil = now + 30000; fails = 0; err.textContent = 'Sai 5 lần, tạm khoá 30 giây.'; }
    }
  };
  api.logout = function(){ try{ sessionStorage.removeItem(KEY); }catch(e){} location.reload(); };
  return api;
})();

var FV = (function(){

  function jget(k, d){ try{ var v = LS.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
  var meta = jget(META, null);
  if(!meta || !meta.years){ meta = { years: [2027], current: 2027 }; LS.setItem(META, JSON.stringify(meta)); }
  var api = { year: meta.current, meta: meta, role: Auth.role };
  api.publish = function(tid, data){ if(api.role !== 'admin') return; try{ LS.setItem('FVSYS:' + api.year + ':shared:' + tid, JSON.stringify(data)); }catch(e){} badges(); };
  api.shared = function(tid){ return jget('FVSYS:' + api.year + ':shared:' + tid, null); };
  api.carry = function(){ return jget('FVSYS:' + api.year + ':carry', null); };
  api.setYear = function(y){ meta.current = +y; LS.setItem(META, JSON.stringify(meta)); location.reload(); };
  api.newYear = function(){

    meta.years.push(ny); meta.current = ny; LS.setItem(META, JSON.stringify(meta)); location.reload();
  };
  api.exportAll = function(){
    if(api.role !== 'admin') return;
    var o = {};
    for(var i = 0; i < LS.length; i++){ var k = LS.key(i); if(k.indexOf('FVSYS:') === 0) o[k] = LS.getItem(k); }

    a.href = URL.createObjectURL(new Blob([JSON.stringify({ app: 'fvpl-system', v: 1, data: o })], { type: 'application/json' }));
    a.download = 'fvpl_system_' + new Date().toISOString().slice(0, 10) + '.json'; a.click();

    r.onload = function(){

        if(!j || j.app !== 'fvpl-system' || !j.data) throw 0;
        if(!confirm('Nhập file sẽ GHI ĐÈ toàn bộ dữ liệu hiện tại. Tiếp tục?')) return;

  var PROFILE = false; // trang Wiki: chỉ gỡ các thao tác sửa hồ sơ
  function calls(code){ var out = [], re = /([A-Za-z_$][\w$.]*)\s*\(/g, m; while((m = re.exec(code))) out.push(m[1]); return out; }

    for(var i = 0; i < list.length; i++){

      for(var e = 0; e < EVT.length; e++){ var c = el.getAttribute(EVT[e]); if(c != null && bad(c)){ if(EVT[e] === 'onclick' && /^\s*(openScore|openAsScoreModal|openAsKoScoreModal|openAsGroupScoreModal)\(/.test(c)) el.setAttribute('data-vm', c); el.removeAttribute(EVT[e]); removed = true; } }
      if(!(VIEWER || PROFILE)){
        if((tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') && !el.disabled){ el.disabled = true; el.setAttribute('data-ro-lock', ''); }
        if(el.getAttribute('draggable') === 'true') el.setAttribute('draggable', 'false');

  + '.card,.rule-card,.panel{border-radius:14px!important;box-shadow:0 10px 30px rgba(0,0,0,.30);animation:fvIn .35s ease both}'

  var started = false, pend = false;

  function start(){
    if(started) return; started = true;
    PROFILE = !!(document.getElementById('profRoot') || /Liquipedia|WIKI/i.test(document.title));
